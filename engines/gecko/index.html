<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>RiftBrowser Gecko Engine</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e13;color:#eef3fb;font:13px system-ui,-apple-system,sans-serif}
    #host{position:fixed;inset:0;display:flex;flex-direction:column;min-height:0}
    #status{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding:7px 9px;background:#111720;border-bottom:1px solid rgba(255,255,255,.09);max-height:96px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box}
    #status strong{font-size:11px;letter-spacing:.08em;line-height:1.4;white-space:nowrap}
    #status span{opacity:.82;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:break-word;line-height:1.4;min-width:0}
    #tracePanel{display:flex;flex-direction:column;max-height:150px;min-height:72px;background:#080b10;border-bottom:1px solid rgba(255,255,255,.09)}
    #tracePanel.hidden{display:none}
    #traceHead{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#0d1219;border-bottom:1px solid rgba(255,255,255,.07);font-size:10px;letter-spacing:.06em}
    #traceHead strong{flex:1}
    #traceHead button{border:1px solid rgba(255,255,255,.13);background:#151c26;color:#eef3fb;border-radius:8px;padding:5px 8px;font:600 10px system-ui,-apple-system,sans-serif}
    #liveTrace{flex:1;min-height:0;margin:0;padding:7px 9px 10px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;white-space:pre;word-break:normal;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b9c8da;user-select:text;-webkit-user-select:text}
    #screen{display:block;flex:1;width:100%;min-height:0;background:#fff;touch-action:none}
    #error{display:none;position:absolute;inset:0;background:#10151d;color:#eef3fb;overflow:hidden;z-index:20;touch-action:pan-y}
    #error.show{display:block}
    #errorBar{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#151c26;border-bottom:1px solid rgba(255,255,255,.1);z-index:2}
    #errorBar strong{font-size:15px;flex:1}
    #errorBar button{border:1px solid rgba(255,255,255,.15);background:#202936;color:#eef3fb;border-radius:10px;padding:8px 11px;font:600 12px system-ui,-apple-system,sans-serif}
    #errorScroll{position:absolute;inset:52px 0 0;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;padding:14px 14px calc(28px + env(safe-area-inset-bottom));box-sizing:border-box}
    #errorText{display:block;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;user-select:text;-webkit-user-select:text}
  </style>
</head>
<body>
  <main id="host">
    <div id="status"><strong>GECKO WASM</strong><span id="statusText">Booting engine…</span></div>
    <section id="tracePanel">
      <div id="traceHead"><strong>LIVE BOOT TRACE</strong><button type="button" id="copyLive">Copy live</button><button type="button" id="jumpLive">Latest</button></div>
      <pre id="liveTrace">Waiting for Gecko bootstrap…</pre>
    </section>
    <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
    <section id="error">
      <div id="errorBar"><strong>Engine diagnostics</strong><button type="button" id="copyTrace">Copy trace</button><button type="button" id="jumpTrace">Latest</button></div>
      <div id="errorScroll"><code id="errorText"></code></div>
    </section>
  </main>
  <script type="module">
    const params=new URLSearchParams(location.search);
    const target=params.get("url")||"data:text/html,<h1>RiftBrowser</h1>";
    const wisp=params.get("wisp")||"";
    const status=document.querySelector("#statusText");
    const statusBar=document.querySelector("#status");
    const tracePanel=document.querySelector("#tracePanel");
    const liveTrace=document.querySelector("#liveTrace");
    const copyLive=document.querySelector("#copyLive");
    const jumpLive=document.querySelector("#jumpLive");
    const errorBox=document.querySelector("#error");
    const errorScroll=document.querySelector("#errorScroll");
    const errorText=document.querySelector("#errorText");
    const copyTrace=document.querySelector("#copyTrace");
    const jumpTrace=document.querySelector("#jumpTrace");
    const canvas=document.querySelector("#screen");
    const tell=(type,detail={})=>parent.postMessage({type:`riftbrowser:gecko:${type}`,...detail},location.origin);

    const bootStarted=performance.now();
    const bootTrace=[];
    let phase="Host preflight";
    let lastDiagnosticText="";
    const elapsed=()=>((performance.now()-bootStarted)/1000).toFixed(1);
    const syncLiveTrace=()=>{
      liveTrace.textContent=bootTrace.length?bootTrace.join("\n"):"Waiting for Gecko bootstrap…";
      requestAnimationFrame(()=>{liveTrace.scrollTop=liveTrace.scrollHeight;liveTrace.scrollLeft=0;});
    };
    const trace=(message)=>{
      const line=`[${elapsed()}s] ${message}`;
      bootTrace.push(line);
      if(bootTrace.length>96)bootTrace.shift();
      syncLiveTrace();
      console.info("[RiftBrowser Gecko]",line);
      return line;
    };
    const mark=(next,detail="")=>{
      phase=next;
      status.textContent=detail?`${next} · ${detail}`:next;
      statusBar.scrollTop=statusBar.scrollHeight;
      trace(detail?`${next}: ${detail}`:next);
      tell("phase",{phase,detail,elapsedSeconds:Number(elapsed())});
    };
    const engineOutput=(kind,value)=>{
      const line=String(value??"");
      trace(`${kind}: ${line}`);
      if(line.includes("wasm instantiate failed"))mark("WASM instantiate failed");
      else if(line.includes("xul_init: GRE dir"))mark("WASM instantiated","Gecko runtime thread started");
      else if(line.includes("OPFS mount skipped"))mark("Filesystem ready","Gecko profile OPFS bypassed for Safari diagnostic");
      else if(line.includes("calling NS_InitXPCOM"))mark("Starting Gecko XPCOM…");
      else if(line.includes("NS_InitXPCOM returned")&&line.includes("SUCCESS"))mark("Gecko XPCOM online","starting browser services");
      else if(line.includes("READY cmd="))mark("Gecko READY");
      if(kind==="stderr")console.warn("[Gecko]",line);else console.log("[Gecko]",line);
    };

    async function copyText(text,button,resetLabel){
      if(!text)return;
      try{
        await navigator.clipboard.writeText(text);
        button.textContent="Copied";
      }catch{
        const area=document.createElement("textarea");
        area.value=text;area.setAttribute("readonly","");area.style.position="fixed";area.style.opacity="0";
        document.body.append(area);area.select();
        try{document.execCommand("copy");button.textContent="Copied";}catch{button.textContent="Select text";}
        area.remove();
      }
      setTimeout(()=>{button.textContent=resetLabel;},1400);
    }
    copyLive.onclick=()=>copyText(bootTrace.join("\n"),copyLive,"Copy live");
    jumpLive.onclick=()=>{liveTrace.scrollTop=liveTrace.scrollHeight;};
    copyTrace.onclick=()=>copyText(lastDiagnosticText||errorText.textContent||"",copyTrace,"Copy trace");
    jumpTrace.onclick=()=>{errorScroll.scrollTop=errorScroll.scrollHeight;};

    const fail=error=>{
      const name=error?.name||"Error";
      const detail=error?.message||String(error);
      const stack=error?.stack||"";
      const diagnostics=`Last phase: ${phase}\nElapsed: ${elapsed()}s\n\nBoot trace:\n${bootTrace.join("\n")}`;
      const message=`${name}: ${detail}\n\n${diagnostics}${stack?`\n\nStack:\n${stack}`:""}`.trim();
      lastDiagnosticText=message;
      status.textContent="Engine failed · diagnostics ready";
      errorText.textContent=message;
      errorBox.classList.add("show");
      requestAnimationFrame(()=>{errorScroll.scrollTop=0;});
      tell("error",{name,detail,stack,message,phase,bootTrace:[...bootTrace]});
      console.error("[RiftBrowser Gecko] init failed",error);
    };

    const hasNativeJSPI=()=>typeof WebAssembly.Suspending==="function"&&typeof WebAssembly.promising==="function";

    async function importBlobSource(source){
      const blobURL=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
      try{return await import(blobURL);}
      finally{URL.revokeObjectURL(blobURL);}
    }

    async function loadGeckoModule(){
      const moduleURL=new URL("./vendor/gecko.js",location.href).href;
      if(hasNativeJSPI()){
        trace("JSPI: native host support detected; using Gecko module unchanged");
        return {module:await import(moduleURL),nativeJSPI:true,softwareBundlePatch:false,preStrippedJSPI:false};
      }

      mark("Preparing Safari software Gecko…","checking bundled pthread runtime");
      const response=await fetch(moduleURL,{cache:"no-store"});
      if(!response.ok)throw new Error(`Could not fetch Gecko module for Safari compatibility (${response.status}).`);
      let source=await response.text();

      const suspendingNeedle="new WebAssembly.Suspending(_gl_present_yield)";
      const promisingNeedle="WebAssembly.promising(getWasmTableEntry(ptr))(arg)";
      const suspendingCount=source.split(suspendingNeedle).length-1;
      const promisingCount=source.split(promisingNeedle).length-1;

      if(suspendingCount===0&&promisingCount===0){
        trace("RiftGecko Mobile: GPU-only JSPI hooks already stripped at build time");
        return {module:await importBlobSource(source),nativeJSPI:false,softwareBundlePatch:false,preStrippedJSPI:true};
      }
      if(suspendingCount<1||promisingCount<1){
        throw new Error(`Safari Gecko compatibility found a partial/unknown JSPI layout (Suspending=${suspendingCount}, promising=${promisingCount}).`);
      }

      source=source.split(suspendingNeedle).join("_gl_present_yield");
      source=source.split(promisingNeedle).join("Promise.resolve(getWasmTableEntry(ptr)(arg))");
      if(source.includes(suspendingNeedle)||source.includes(promisingNeedle))throw new Error("Safari Gecko compatibility patch left an active JSPI hook in the bundled runtime.");

      trace(`Upstream compatibility patch: removed ${suspendingCount} Suspending hook(s), restored ${promisingCount} pthread entry hook(s)`);
      return {module:await importBlobSource(source),nativeJSPI:false,softwareBundlePatch:true,preStrippedJSPI:false};
    }

    try{
      if(!crossOriginIsolated)throw new Error("Gecko WASM requires cross-origin isolation. Reload RiftOS once after the service worker update.");
      if(typeof SharedArrayBuffer!=="function")throw new Error("SharedArrayBuffer is unavailable in this WebKit context.");

      mark("Checking Safari compatibility…");
      const loaded=await loadGeckoModule();
      const {Gecko}=loaded.module;
      window.RiftGeckoCompat=Object.freeze({nativeJSPI:loaded.nativeJSPI,softwareBundlePatch:loaded.softwareBundlePatch,preStrippedJSPI:loaded.preStrippedJSPI,gpu:false});
      const wasmURL=new URL("./vendor/gecko.wasm.zst",location.href).href;
      const modeDetail=loaded.preStrippedJSPI?"RiftGecko Mobile · JSPI-free worker build":loaded.softwareBundlePatch?"upstream Safari worker patch active":"native JSPI runtime";
      mark("Gecko module loaded",modeDetail);

      const env={GECKO_NOWASMJIT:"1",GECKO_SKIP_OPFS:"1"};
      const gecko=new Gecko({
        canvas,
        wasm:{url:wasmURL,compressed:true},
        wispUrl:wisp.trim()||undefined,
        env,
        print:value=>engineOutput("stdout",value),
        printErr:value=>engineOutput("stderr",value)
      });
      window.RiftGecko=gecko;

      mark("Initializing Gecko","fetch → zstd decode → WASM instantiate → pthreads");
      let timeoutId;
      const timeoutMs=120000;
      const timeout=new Promise((_,reject)=>{
        timeoutId=setTimeout(()=>reject(new Error(`Gecko initialization timed out after ${timeoutMs/1000}s. Last phase: ${phase}.`)),timeoutMs);
      });
      try{await Promise.race([gecko.init(),timeout]);}
      finally{clearTimeout(timeoutId);}

      mark("Gecko engine ready",loaded.preStrippedJSPI?"RiftGecko Mobile":loaded.softwareBundlePatch?"Safari software mode":"native JSPI");
      tell("ready",{target,wispConfigured:!!wisp,nativeJSPI:loaded.nativeJSPI,softwareBundlePatch:loaded.softwareBundlePatch,preStrippedJSPI:loaded.preStrippedJSPI,profilePersistence:false,bootSeconds:Number(elapsed())});

      if(/^https?:/i.test(target)&&!wisp){
        const safeTarget=String(target).replace(/[<>&"']/g,"");
        const start=`data:text/html;charset=utf-8,${encodeURIComponent(`<!doctype html><meta name="viewport" content="width=device-width"><style>body{font:16px system-ui;padding:24px;line-height:1.45}code{word-break:break-all}</style><h1>Gecko engine ready</h1><p>RiftBrowser successfully booted Firefox Gecko inside RiftOS.</p><p>Safari software mode uses an ephemeral Gecko profile while compatibility work continues. RiftOS storage is unaffected.</p><p>Configure a Wisp endpoint to browse external HTTPS sites.</p><p>Requested: <code>${safeTarget}</code></p>`)}`;
        mark("Engine ready","Wisp required for external sites");
        tracePanel.classList.add("hidden");
        await gecko.load(start);
        tell("loaded",{url:start,engineReady:true,wispRequired:true,requested:target});
      }else{
        mark("Loading page",target);
        tracePanel.classList.add("hidden");
        await gecko.load(target);
        status.textContent=target;
        tell("loaded",{url:target,engineReady:true});
      }
      canvas.focus({preventScroll:true});
    }catch(error){fail(error);}
  </script>
</body>
</html>
