<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>RiftBrowser Gecko Engine</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e13;color:#eef3fb;font:13px system-ui,-apple-system,sans-serif}
    #host{position:fixed;inset:0;display:flex;flex-direction:column}
    #status{display:flex;gap:8px;align-items:center;padding:6px 9px;background:#111720;border-bottom:1px solid rgba(255,255,255,.09);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #status strong{font-size:11px;letter-spacing:.08em}#status span{opacity:.72;overflow:hidden;text-overflow:ellipsis}
    #screen{display:block;flex:1;width:100%;min-height:0;background:#fff;touch-action:none}
    #error{display:none;position:absolute;inset:34px 0 0;padding:24px;background:#10151d;color:#eef3fb;overflow:auto}#error.show{display:block}
    code{white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <main id="host">
    <div id="status"><strong>GECKO WASM</strong><span id="statusText">Booting engine…</span></div>
    <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
    <section id="error"><h2>Engine failed</h2><code id="errorText"></code></section>
  </main>
  <script type="module">
    const params=new URLSearchParams(location.search);
    const target=params.get("url")||"data:text/html,<h1>RiftBrowser</h1>";
    const wisp=params.get("wisp")||"";
    const status=document.querySelector("#statusText");
    const errorBox=document.querySelector("#error");
    const errorText=document.querySelector("#errorText");
    const canvas=document.querySelector("#screen");
    const tell=(type,detail={})=>parent.postMessage({type:`riftbrowser:gecko:${type}`,...detail},location.origin);

    const bootStarted=performance.now();
    const bootTrace=[];
    let phase="Host preflight";
    const elapsed=()=>((performance.now()-bootStarted)/1000).toFixed(1);
    const trace=(message)=>{
      const line=`[${elapsed()}s] ${message}`;
      bootTrace.push(line);
      if(bootTrace.length>48)bootTrace.shift();
      console.info("[RiftBrowser Gecko]",line);
      return line;
    };
    const mark=(next,detail="")=>{
      phase=next;
      status.textContent=detail?`${next} · ${detail}`:next;
      trace(detail?`${next}: ${detail}`:next);
      tell("phase",{phase,detail,elapsedSeconds:Number(elapsed())});
    };
    const engineOutput=(kind,value)=>{
      const line=String(value??"");
      trace(`${kind}: ${line}`);
      if(line.includes("wasm instantiate failed"))mark("WASM instantiate failed");
      else if(line.includes("xul_init: GRE dir"))mark("WASM instantiated","Gecko runtime thread started");
      else if(line.includes("OPFS mount skipped"))mark("Filesystem ready","Gecko profile OPFS bypassed for Safari diagnostic");
      else if(line.includes("calling NS_InitXPCOM"))mark("Starting Gecko XPCOM…");
      else if(line.includes("NS_InitXPCOM returned")&&line.includes("SUCCESS"))mark("Gecko XPCOM online","starting browser services");
      else if(line.includes("READY cmd="))mark("Gecko READY");
      if(kind==="stderr")console.warn("[Gecko]",line);else console.log("[Gecko]",line);
    };
    const fail=error=>{
      const name=error?.name||"Error";
      const detail=error?.message||String(error);
      const stack=error?.stack||"";
      const diagnostics=`Last phase: ${phase}\nElapsed: ${elapsed()}s\n\nBoot trace:\n${bootTrace.join("\n")}`;
      const message=`${name}: ${detail}\n\n${diagnostics}${stack?`\n\nStack:\n${stack}`:""}`.trim();
      status.textContent="Engine failed";
      errorText.textContent=message;
      errorBox.classList.add("show");
      tell("error",{name,detail,stack,message,phase,bootTrace:[...bootTrace]});
      console.error("[RiftBrowser Gecko] init failed",error);
    };

    function installSoftwareJSPICompatibility(){
      const nativeJSPI=typeof WebAssembly.Suspending==="function"&&typeof WebAssembly.promising==="function";
      if(nativeJSPI)return {nativeJSPI:true,softwareFallback:false};

      // firefox-wasm v0.0.1 manually wires JSPI only for its GPU present/yield path.
      // RiftOS boots Gecko in software-composited mode on iOS. These shims restore
      // the synchronous pthread behavior required by that path; they are NOT JSPI.
      const SuspendingFallback=function RiftSoftwareSuspendingFallback(fn){return fn;};
      const promisingFallback=fn=>(...args)=>{
        try{return Promise.resolve(fn(...args));}
        catch(error){return Promise.reject(error);}
      };

      try{
        if(typeof WebAssembly.Suspending!=="function")Object.defineProperty(WebAssembly,"Suspending",{configurable:true,writable:true,value:SuspendingFallback});
        if(typeof WebAssembly.promising!=="function")Object.defineProperty(WebAssembly,"promising",{configurable:true,writable:true,value:promisingFallback});
      }catch(error){
        throw new Error(`Safari software-mode compatibility could not install: ${error?.message||error}`);
      }
      if(typeof WebAssembly.Suspending!=="function"||typeof WebAssembly.promising!=="function")throw new Error("Safari software-mode compatibility could not expose the JSPI entry shims.");
      return {nativeJSPI:false,softwareFallback:true};
    }

    try{
      if(!crossOriginIsolated)throw new Error("Gecko WASM requires cross-origin isolation. Reload RiftOS once after the service worker update.");
      if(typeof SharedArrayBuffer!=="function")throw new Error("SharedArrayBuffer is unavailable in this WebKit context.");

      mark("Checking Safari compatibility…");
      const compat=installSoftwareJSPICompatibility();
      window.RiftGeckoCompat=Object.freeze({...compat,gpu:false});
      trace(`JSPI: ${compat.nativeJSPI?"native":"software-mode compatibility"}`);

      mark("Loading Gecko JavaScript module…");
      const {Gecko}=await import("./vendor/gecko.js");
      const wasmURL=new URL("./vendor/gecko.wasm.zst",location.href).href;
      mark("Gecko module loaded","preparing engine runtime");

      const env={
        GECKO_NOWASMJIT:"1",
        // v0.0.1 normally mounts its profile through WasmFS native OPFS. Safari is
        // currently hanging during startup, so isolate engine boot from profile
        // persistence first. Upstream explicitly provides this diagnostic escape.
        GECKO_SKIP_OPFS:"1"
      };
      if(env.GECKO_GPU)throw new Error("Safari software JSPI compatibility cannot be used with Gecko GPU mode.");

      const gecko=new Gecko({
        canvas,
        wasm:{url:wasmURL,compressed:true},
        wispUrl:wisp.trim()||undefined,
        env,
        print:value=>engineOutput("stdout",value),
        printErr:value=>engineOutput("stderr",value)
      });
      window.RiftGecko=gecko;

      mark("Initializing Gecko","fetch → zstd decode → WASM instantiate → pthreads");
      let timeoutId;
      const timeoutMs=120000;
      const timeout=new Promise((_,reject)=>{
        timeoutId=setTimeout(()=>reject(new Error(`Gecko initialization timed out after ${timeoutMs/1000}s. Last phase: ${phase}.`)),timeoutMs);
      });
      try{
        await Promise.race([gecko.init(),timeout]);
      }finally{
        clearTimeout(timeoutId);
      }
      mark("Gecko engine ready",compat.softwareFallback?"Safari software mode":"native JSPI");
      tell("ready",{target,wispConfigured:!!wisp,nativeJSPI:compat.nativeJSPI,softwareJSPICompatibility:compat.softwareFallback,profilePersistence:false,bootSeconds:Number(elapsed())});

      if(/^https?:/i.test(target)&&!wisp){
        const safeTarget=String(target).replace(/[<>&"']/g,"");
        const start=`data:text/html;charset=utf-8,${encodeURIComponent(`<!doctype html><meta name="viewport" content="width=device-width"><style>body{font:16px system-ui;padding:24px;line-height:1.45}code{word-break:break-all}</style><h1>Gecko engine ready</h1><p>RiftBrowser successfully booted Firefox Gecko inside RiftOS.</p><p>Safari diagnostic mode currently uses an ephemeral Gecko profile. RiftOS storage is unaffected.</p><p>Configure a Wisp endpoint to browse external HTTPS sites.</p><p>Requested: <code>${safeTarget}</code></p>`)}`;
        mark("Engine ready","Wisp required for external sites");
        await gecko.load(start);
        tell("loaded",{url:start,engineReady:true,wispRequired:true,requested:target});
      }else{
        mark("Loading page",target);
        await gecko.load(target);
        status.textContent=target;
        tell("loaded",{url:target,engineReady:true});
      }
      canvas.focus({preventScroll:true});
    }catch(error){fail(error);}
  </script>
</body>
</html>
