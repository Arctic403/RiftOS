<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>RiftBrowser Gecko Engine</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e13;color:#eef3fb;font:13px system-ui,-apple-system,sans-serif}
    #host{position:fixed;inset:0;display:flex;flex-direction:column}
    #status{display:flex;gap:8px;align-items:center;padding:6px 9px;background:#111720;border-bottom:1px solid rgba(255,255,255,.09);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #status strong{font-size:11px;letter-spacing:.08em}#status span{opacity:.72;overflow:hidden;text-overflow:ellipsis}
    #screen{display:block;flex:1;width:100%;min-height:0;background:#fff;touch-action:none}
    #error{display:none;position:absolute;inset:34px 0 0;padding:24px;background:#10151d;color:#eef3fb;overflow:auto}#error.show{display:block}
    code{white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <main id="host">
    <div id="status"><strong>GECKO WASM</strong><span id="statusText">Booting engine…</span></div>
    <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
    <section id="error"><h2>Engine failed</h2><code id="errorText"></code></section>
  </main>
  <script type="module">
    const params=new URLSearchParams(location.search);
    const target=params.get("url")||"data:text/html,<h1>RiftBrowser</h1>";
    const wisp=params.get("wisp")||"";
    const status=document.querySelector("#statusText");
    const errorBox=document.querySelector("#error");
    const errorText=document.querySelector("#errorText");
    const canvas=document.querySelector("#screen");
    const tell=(type,detail={})=>parent.postMessage({type:`riftbrowser:gecko:${type}`,...detail},location.origin);
    const fail=error=>{
      const name=error?.name||"Error";
      const detail=error?.message||String(error);
      const stack=error?.stack||"";
      const message=`${name}: ${detail}\n${stack}`.trim();
      status.textContent="Engine failed";
      errorText.textContent=message;
      errorBox.classList.add("show");
      tell("error",{name,detail,stack,message});
      console.error("[RiftBrowser Gecko] init failed",error);
    };

    function installSoftwareJSPICompatibility(){
      const nativeJSPI=typeof WebAssembly.Suspending==="function"&&typeof WebAssembly.promising==="function";
      if(nativeJSPI)return {nativeJSPI:true,softwareFallback:false};

      // firefox-wasm v0.0.1 manually wires JSPI only for its GPU present/yield path.
      // RiftOS intentionally boots Gecko in software-composited mode on iOS, so Safari
      // can use the original synchronous pthread behavior when JSPI is unavailable.
      // This is NOT a JSPI implementation and must never be used with GECKO_GPU.
      const SuspendingFallback=function RiftSoftwareSuspendingFallback(fn){return fn;};
      const promisingFallback=fn=>(...args)=>{
        try{return Promise.resolve(fn(...args));}
        catch(error){return Promise.reject(error);}
      };

      try{
        if(typeof WebAssembly.Suspending!=="function")Object.defineProperty(WebAssembly,"Suspending",{configurable:true,writable:true,value:SuspendingFallback});
        if(typeof WebAssembly.promising!=="function")Object.defineProperty(WebAssembly,"promising",{configurable:true,writable:true,value:promisingFallback});
      }catch(error){
        throw new Error(`Safari software-mode compatibility could not install: ${error?.message||error}`);
      }

      if(typeof WebAssembly.Suspending!=="function"||typeof WebAssembly.promising!=="function")throw new Error("Safari software-mode compatibility could not expose the JSPI entry shims.");
      return {nativeJSPI:false,softwareFallback:true};
    }

    try{
      if(!crossOriginIsolated)throw new Error("Gecko WASM requires cross-origin isolation. Reload RiftOS once after the service worker update.");
      if(typeof SharedArrayBuffer!=="function")throw new Error("SharedArrayBuffer is unavailable in this WebKit context.");

      status.textContent="Checking Gecko compatibility…";
      const compat=installSoftwareJSPICompatibility();
      window.RiftGeckoCompat=Object.freeze({...compat,gpu:false});
      console.info("[RiftBrowser Gecko] compatibility",window.RiftGeckoCompat);

      status.textContent="Loading Gecko module…";
      const {Gecko}=await import("./vendor/gecko.js");
      const wasmURL=new URL("./vendor/gecko.wasm.zst",location.href).href;

      // Keep this constructor intentionally aligned with the upstream v0.0.1
      // embed demo. Extra host knobs are added only after the base engine boots.
      const env={};
      // Gecko itself still runs as WASM. Disable the experimental guest-content
      // WASM JIT while proving the iOS/WebKit base engine path.
      env.GECKO_NOWASMJIT="1";
      // Critical invariant for the Safari fallback above: do NOT enable GECKO_GPU.
      if(env.GECKO_GPU)throw new Error("Safari software JSPI compatibility cannot be used with Gecko GPU mode.");

      const gecko=new Gecko({
        canvas,
        wasm:{url:wasmURL,compressed:true},
        wispUrl:wisp.trim()||undefined,
        env,
        print:value=>console.log("[Gecko]",value),
        printErr:value=>console.warn("[Gecko]",value)
      });
      window.RiftGecko=gecko;

      status.textContent=compat.nativeJSPI?"Initializing Gecko…":"Initializing Gecko · Safari software mode…";
      await gecko.init();
      tell("ready",{target,wispConfigured:!!wisp,nativeJSPI:compat.nativeJSPI,softwareJSPICompatibility:compat.softwareFallback});

      if(/^https?:/i.test(target)&&!wisp){
        const safeTarget=String(target).replace(/[<>&"']/g,"");
        const start=`data:text/html;charset=utf-8,${encodeURIComponent(`<!doctype html><meta name="viewport" content="width=device-width"><style>body{font:16px system-ui;padding:24px;line-height:1.45}code{word-break:break-all}</style><h1>Gecko engine ready</h1><p>RiftBrowser successfully booted Firefox Gecko inside RiftOS.</p><p>Configure a Wisp endpoint to browse external HTTPS sites.</p><p>Requested: <code>${safeTarget}</code></p>`)}`;
        status.textContent=`Engine ready${compat.softwareFallback?" · Safari software mode":""} · Wisp required`;
        await gecko.load(start);
        tell("loaded",{url:start,engineReady:true,wispRequired:true,requested:target});
      }else{
        status.textContent=`Loading ${target}`;
        await gecko.load(target);
        status.textContent=target;
        tell("loaded",{url:target,engineReady:true});
      }
      canvas.focus({preventScroll:true});
    }catch(error){fail(error);}
  </script>
</body>
</html>
