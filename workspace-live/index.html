<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Rift Workspace Live</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="workspace-app">
    <header class="topbar">
      <div>
        <span class="eyebrow">LOCAL HTML / LIVE WORKSPACE</span>
        <strong>Rift Workspace</strong>
      </div>
      <div class="live-state"><i id="liveDot"></i><span id="liveText">Connecting</span><button id="refreshBtn" type="button">Refresh</button></div>
    </header>

    <section class="layout">
      <aside class="browser-pane">
        <div class="pathbar"><button id="upBtn" type="button">↑</button><span id="pathLabel">/</span></div>
        <div class="fs-actions"><button id="newFileBtn" type="button">+ File</button><button id="newFolderBtn" type="button">+ Folder</button></div>
        <input id="filterInput" class="filter" placeholder="Filter this folder" autocomplete="off">
        <div id="fileList" class="file-list"></div>
      </aside>

      <section class="editor-pane">
        <div class="editor-head">
          <div><strong id="fileName">Select a file</strong><small id="revision">No file open</small></div>
          <div class="editor-actions"><label><input id="followLive" type="checkbox" checked> Follow live</label><button id="renameBtn" type="button" disabled>Rename</button><button id="deleteBtn" type="button" disabled>Delete</button><button id="saveBtn" type="button" disabled>Save</button></div>
        </div>
        <div id="conflict" class="conflict hidden"></div>
        <textarea id="editor" spellcheck="false" disabled placeholder="Choose a text file from the workspace."></textarea>
        <div class="diff-panel">
          <header><strong>Last live change</strong><small id="diffMeta">Waiting for edits</small></header>
          <pre id="diffOutput">No workspace changes observed yet.</pre>
        </div>
      </section>

      <aside class="activity-pane">
        <header><strong>Activity</strong><button id="clearActivity" type="button">Clear</button></header>
        <div id="activityLog" class="activity-log"><div class="empty">MCP and local edits will appear here.</div></div>
      </aside>
    </section>
  </main>
  <script defer src="./app.js"></script>
</body>
</html>
