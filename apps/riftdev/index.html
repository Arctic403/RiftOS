<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#11141a">
    <meta name="color-scheme" content="dark light">
    <meta name="format-detection" content="telephone=no">
    <title>RiftDev</title>
    <link rel="stylesheet" href="style.css?v=20260902-android-native-v13">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" id="prismTheme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body data-build="AndroidNative-v13-Samsung-20260902">
    <div class="app-container" id="appContainer">
        <header class="app-header" id="appHeader">
            <h1>RiftDev</h1>
            <div class="header-controls">
                <select id="themeSelect" class="config-select theme-select">
                    <option value="dark">Dark Theme</option>
                    <option value="light">Light Theme</option>
                    <option value="monokai">Monokai Theme</option>
                </select>
                <div class="view-tabs">
                    <button class="tab-btn active" id="tabExplorer">📁 Explorer</button>
                    <button class="tab-btn" id="tabEditor">📝 Editor</button>
                </div>
            </div>
        </header>

        <main class="page-view active" id="explorerView">
            <details class="config-panel" id="configPanel">
                <summary>⚙️ GitHub Settings & Config</summary>
                <div class="config-grid">
                    <div class="input-group">
                        <label>Personal Access Token (encrypted by Android Keystore):</label>
                        <input type="password" id="tokenInput" placeholder="github token">
                    </div>
                    <button class="btn btn-secondary" id="connectGhBtn">Connect GitHub</button>
                    <div class="input-group"><label>Repository:</label><select id="repoSelect" class="config-select"><option value="">-- Connect Token First --</option></select></div>
                    <div class="input-group"><label>Branch:</label><select id="branchSelect" class="config-select"><option value="">-- Choose Branch --</option></select></div>
                    <button class="btn btn-success" id="pullGitHubBtn">⬇️ Pull Repo</button>
                    <div class="gh-sync-card" id="ghSyncCard">
                        <div class="gh-sync-title">Git Sync</div>
                        <div class="gh-sync-row"><span>Workspace:</span><strong id="ghSyncRepo">Not bound yet</strong></div>
                        <div class="gh-sync-row"><span>Branch:</span><strong id="ghSyncBranch">—</strong></div>
                        <div class="gh-sync-changes" id="ghSyncChanges">Pull a repo once to create a sync baseline.</div>
                        <div class="gh-sync-progress" id="ghSyncProgress" aria-live="polite"></div>
                    </div>
                </div>
            </details>

            <div class="toolbar" id="appToolbar">
                <button class="btn btn-success" id="newFileBtn">+ New File</button>
                <button class="btn btn-secondary" id="newFolderBtn">+ New Folder</button>
                <button class="btn btn-secondary" id="workspacePasteBtn" title="Paste copied/cut item into the selected folder">📋 Paste</button>
                <label class="btn btn-secondary">📥 Upload / Import<input type="file" id="uploadInput" multiple style="display:none;"></label>
                <label class="btn btn-secondary">📂 Import Folder<input type="file" id="folderUploadInput" webkitdirectory directory multiple style="display:none;"></label>
                <button class="btn btn-warning" id="exportWorkspaceBtn">📦 Export ZIP</button>
                <button class="btn btn-secondary" id="exportAiWorkspaceBtn">🤖 Export AI Workspace</button>
                <button class="btn btn-secondary" id="importAiPatchBtn">🧩 Import AI Patch</button>
                <button class="btn btn-secondary hidden" id="reviewAiPatchBtn">🧩 Review Patch</button>
                <input type="file" id="aiPatchInput" accept=".json,.rcpatch,.txt,application/json,text/plain" style="display:none;">
                <button class="btn btn-success" id="localTestBtn" type="button">⚡ Local Test</button>
                <button class="btn btn-secondary" id="pushAllGitHubBtn" disabled>☁️ Push Changes</button>
            </div>

            <section class="file-manager-section" id="explorerSection">
                <div class="fm-header"><span>Android RiftWorkspace</span><span id="itemCount">0 items</span></div>
                <div class="file-tree" id="fileTree"></div>
            </section>
        </main>

        <main class="page-view" id="editorView">
            <section class="editor-section" id="editorSection">
                <div class="editor-header">
                    <div class="active-file-info"><span id="saveIndicator" class="save-indicator clean" title="Saved">●</span><span id="activeFileLabel">No file selected</span></div>
                    <div class="editor-actions">
                        <button class="btn btn-sm btn-secondary" id="quickOpenBtn">🔍 Find File</button>
                        <button class="btn btn-sm btn-secondary" id="splitPaneBtn">▥ Split</button>
                        <button class="btn btn-sm btn-secondary" id="jumpLineBtn">⚓ Jump L#</button>
                        <button class="btn btn-sm btn-secondary" id="searchToggleBtn">🔍 Find/Replace</button>
                        <button class="btn btn-sm btn-success" id="saveLocalBtn">💾 Save</button>
                        <button class="btn btn-sm btn-secondary" id="pushGitHubBtn">☁️ Push</button>
                        <button class="btn btn-sm btn-secondary" id="fullscreenBtn">⛶ Fullscreen</button>
                        <button class="btn btn-sm btn-danger" id="closeFileBtn">✕</button>
                    </div>
                </div>
                <div class="breadcrumb-bar" id="breadcrumbBar"><span class="breadcrumb-item">workspace</span></div>
                <div class="block-navigation-bar" id="blockNav"><span class="no-blocks">No defined #region blocks</span></div>
                <div class="search-bar hidden" id="searchReplaceBar">
                    <input type="text" id="searchInput" placeholder="Find text..."><input type="text" id="replaceInput" placeholder="Replace with...">
                    <button class="btn btn-sm btn-secondary" id="findNextBtn">Find Next</button><button class="btn btn-sm btn-warning" id="replaceBtn">Replace</button><button class="btn btn-sm btn-warning" id="replaceAllBtn">All</button>
                </div>
                <div class="workspace-panes" id="workspacePanes">
                    <div class="editor-workspace pane-primary">
                        <div class="line-numbers" id="lineNumbers">1</div>
                        <div class="editor-wrapper"><pre class="highlight-layer" id="highlightLayer"><code id="highlightCode"></code></pre><textarea id="editor" class="editor-textarea" spellcheck="false" autocomplete="off" placeholder="Select or create a file to start editing..."></textarea></div>
                    </div>
                    <div class="editor-workspace pane-secondary hidden" id="secondaryPane">
                        <div class="pane-header"><span id="secondaryPaneTitle">Secondary View</span><button class="btn btn-sm btn-danger" id="closeSplitBtn">✕</button></div>
                        <div class="editor-wrapper"><pre class="highlight-layer" id="secondaryHighlightLayer"><code id="secondaryHighlightCode"></code></pre><textarea id="secondaryEditorView" class="editor-textarea" spellcheck="false" autocomplete="off" readonly></textarea></div>
                    </div>
                </div>
                <div class="accessory-keyboard-bar" id="symbolBar"></div>
            </section>
        </main>
    </div>

    <div class="modal-overlay hidden" id="quickOpenModal">
        <div class="modal-content"><div class="modal-header"><h3>Quick Open File</h3><span class="modal-close" id="closeQuickOpenModal">✕</span></div><input type="text" id="quickOpenInput" placeholder="Type file name or path..." autocomplete="off"><div class="quick-open-results" id="quickOpenResults"></div></div>
    </div>

    <script src="riftdev-android-storage.js?v=1"></script>
    <script type="module">
      const load = src => new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load '+src));document.body.appendChild(s);});
      await window.RiftDevAndroidReady;
      for (const src of [
        'riftdev-android.js?v=13-samsung-native',
        'ide-v11.js?v=13-android-shell',
        'ai-handoff.js?v=3-android-native',
        'local-test-android.js?v=1',
        'riftos-overlay.js?v=4-android'
      ]) await load(src);
      window.RiftDevAndroidBindSecrets?.();
    </script>
</body>
</html>
