<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
  <meta name="theme-color" content="#0a0d12">
  <meta name="color-scheme" content="dark">
  <title>RiftOS</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./src/riftdesktop-android.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark">R</div>
    <div class="boot-title">RiftOS</div>
    <div class="boot-sub">RiftKernel / Samsung Android Native Runtime</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <main id="os" class="os hidden" aria-label="RiftOS desktop">
    <header class="statusbar">
      <strong>RiftOS</strong>
      <span id="statusText">Booting Android RiftKernel</span>
      <time id="clock"></time>
    </header>

    <section id="content" class="content">
      <section id="workspace" class="workspace">
        <div class="hero">
          <div>
            <span class="eyebrow">RIFTKERNEL / SAMSUNG ANDROID</span>
            <h1>Your pocket computer.</h1>
            <p>Android-native RiftFS, Storage Access Framework mounts, native browser, native preview and Android system services.</p>
          </div>
          <div class="hero-actions" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px">
            <button class="pill" data-open="terminal" style="margin-top:0">Open RiftShell</button>
            <a class="pill apk-download" href="https://github.com/Arctic403/RiftOS/releases/download/android-latest/RiftOS-Android-debug.apk" target="_blank" rel="noopener" style="margin-top:0;display:inline-flex;align-items:center;color:inherit;text-decoration:none">↓ Android APK</a>
          </div>
        </div>
        <div class="app-grid" id="appGrid"></div>
      </section>
      <section id="stage" class="stage hidden" aria-live="polite"></section>
    </section>

    <nav class="dock" aria-label="Dock">
      <button data-open="home" class="dock-btn active">⌂<span>Home</span></button>
      <button data-open="files" class="dock-btn">▣<span>Files</span></button>
      <button data-open="workspace-live" class="dock-btn">◈<span>Live</span></button>
      <button data-open="terminal" class="dock-btn">&gt;_<span>Shell</span></button>
      <button data-open="browser" class="dock-btn">◎<span>Web</span></button>
      <button data-open="settings" class="dock-btn">⚙<span>Settings</span></button>
    </nav>
  </main>

  <template id="windowTemplate">
    <article class="window">
      <header class="window-bar">
        <div><small class="window-kicker"></small><strong class="window-title"></strong></div>
        <button class="window-close" aria-label="Close">×</button>
      </header>
      <div class="window-body"></div>
    </article>
  </template>

  <script type="module" src="./src/riftandroid-entry.js"></script>
</body>
</html>
