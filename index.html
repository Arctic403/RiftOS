<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RiftOS">
  <title>RiftOS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./src/riftbrowser-ui.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark">R</div>
    <div class="boot-title">RiftOS</div>
    <div class="boot-sub">RiftKernel / WebKit Runtime</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <main id="os" class="os hidden" aria-label="RiftOS desktop">
    <header class="statusbar">
      <strong>RiftOS</strong>
      <span id="statusText">Booting RiftKernel</span>
      <time id="clock"></time>
    </header>

    <section id="content" class="content">
      <section id="workspace" class="workspace">
        <div class="hero">
          <div>
            <span class="eyebrow">RIFTKERNEL / WEBKIT HOST</span>
            <h1>Your pocket computer.</h1>
            <p>One kernel. OPFS filesystem. Apple WebKit host. No signed RiftOS app required.</p>
          </div>
          <button class="pill" data-open="terminal">Open RiftShell</button>
        </div>
        <div class="app-grid" id="appGrid"></div>
      </section>

      <section id="stage" class="stage hidden" aria-live="polite"></section>
    </section>

    <nav class="dock" aria-label="Dock">
      <button data-open="home" class="dock-btn active">⌂<span>Home</span></button>
      <button data-open="files" class="dock-btn">▣<span>Files</span></button>
      <button data-open="terminal" class="dock-btn">&gt;_<span>Shell</span></button>
      <button data-open="browser" class="dock-btn">◎<span>Web</span></button>
      <button data-open="settings" class="dock-btn">⚙<span>Settings</span></button>
    </nav>
  </main>

  <template id="windowTemplate">
    <article class="window">
      <header class="window-bar">
        <div>
          <small class="window-kicker"></small>
          <strong class="window-title"></strong>
        </div>
        <button class="window-close" aria-label="Close">×</button>
      </header>
      <div class="window-body"></div>
    </article>
  </template>

  <script type="module" src="./src/riftcore.js"></script>
  <script type="module" src="./src/riftworkspace-web.js"></script>
  <script type="module" src="./src/riftruntime.js"></script>
  <script type="module" src="./src/riftbrowser-kernel.js"></script>
  <script type="module" src="./src/riftapps.js"></script>
  <script type="module" src="./src/riftapps-files.js"></script>
  <script type="module" src="./src/riftgit.js"></script>
  <script type="module" src="./src/riftdev-host.js"></script>
  <script type="module" src="./src/riftos.js"></script>
  <script type="module" src="./src/riftbrowser-ui.js"></script>
</body>
</html>
