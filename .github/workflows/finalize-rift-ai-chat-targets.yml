      - name: Apply ChatGPT Web target picker
        shell: bash
        run: |
          git apply --check "$RUNNER_TEMP/rift-ai-chat-targets.patch"
          git apply "$RUNNER_TEMP/rift-ai-chat-targets.patch"
          node --check android/app/src/main/assets/riftbrowser-mcp-app.js
          node --check src/riftai-workspace.js
          grep -Fq 'ai.targets' android/app/src/main/java/com/riftos/app/MainActivity.kt
          grep -Fq 'collectChatTargets' android/app/src/main/assets/riftbrowser-mcp-app.js
          grep -Fq 'openTargetSearch' android/app/src/main/assets/riftbrowser-mcp-app.js
          grep -Fq '0.9.2-rift-ai-chat-targets-alpha' android/app/build.gradle.kts
          if grep -Eqi 'api\.openai\.com|OPENAI_API_KEY|Authorization:[[:space:]]*Bearer' src/riftai-workspace.js android/app/src/main/assets/riftbrowser-mcp-app.js; then
            echo 'Direct model API path leaked into Rift AI target picker' >&2
            exit 1
          fi

      - name: Commit finalized feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/build.gradle.kts android/app/src/main/assets/riftbrowser-mcp-app.js android/app/src/main/java/com/riftos/app/MainActivity.kt android/app/src/main/java/com/riftos/app/RiftBrowserWindow.kt src/riftai-workspace.js styles.css README.md docs/PROJECT_STATUS.md docs/RIFT_AI_WORKSPACE.md docs/RIFT_BROWSER_MCP_APP.md
          git commit -m 'Android: add ChatGPT Web chat target picker'
          git push origin HEAD:main
