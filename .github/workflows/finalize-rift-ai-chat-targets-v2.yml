name: Finalize Rift AI Chat Targets V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-rift-ai-chat-targets-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover reviewed patch payload
        shell: bash
        run: |
          sed -n "/<<'RIFT_PATCH_B64'/,/^[[:space:]]*RIFT_PATCH_B64$/p" .github/workflows/finalize-rift-ai-chat-targets.yml \
            | sed '1d;$d' \
            | tr -d '[:space:]' \
            | base64 --decode \
            | gzip -d > "$RUNNER_TEMP/rift-ai-chat-targets.patch"
          test -s "$RUNNER_TEMP/rift-ai-chat-targets.patch"
          grep -Fq 'collectChatTargets' "$RUNNER_TEMP/rift-ai-chat-targets.patch"

      - name: Apply exact reviewed source transforms
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/rift-ai-chat-targets.patch" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text().splitlines(keepends=True)
          sections = []
          index = 0
          while index < len(lines):
              if not lines[index].startswith('diff --git '):
                  index += 1
                  continue
              path = lines[index].strip().split()[3][2:]
              index += 1
              hunks = []
              while index < len(lines) and not lines[index].startswith('diff --git '):
                  if lines[index].startswith('@@'):
                      index += 1
                      hunk = []
                      while index < len(lines) and not lines[index].startswith('@@') and not lines[index].startswith('diff --git '):
                          hunk.append(lines[index])
                          index += 1
                      hunks.append(hunk)
                  else:
                      index += 1
              sections.append((path, hunks))

          allowed = {
              'android/app/src/main/assets/riftbrowser-mcp-app.js',
              'android/app/src/main/java/com/riftos/app/MainActivity.kt',
              'android/app/src/main/java/com/riftos/app/RiftBrowserWindow.kt',
              'src/riftai-workspace.js',
              'styles.css',
              'android/app/build.gradle.kts',
              'README.md',
              'docs/PROJECT_STATUS.md',
              'docs/RIFT_AI_WORKSPACE.md',
              'docs/RIFT_BROWSER_MCP_APP.md',
          }
          if {path for path, _ in sections} != allowed:
              raise SystemExit('reviewed patch path set changed')

          for path, hunks in sections:
              file_path = Path(path)
              text = file_path.read_text()
              cursor = 0
              for number, hunk in enumerate(hunks, 1):
                  before, after = [], []
                  for line in hunk:
                      if not line or line == '\n' or line.startswith('\\ No newline'):
                          continue
                      prefix, payload = line[0], line[1:]
                      if prefix == ' ':
                          before.append(payload); after.append(payload)
                      elif prefix == '-':
                          before.append(payload)
                      elif prefix == '+':
                          after.append(payload)
                      else:
                          raise SystemExit(f'{path} hunk {number}: invalid patch prefix')
                  old, new = ''.join(before), ''.join(after)
                  if not old:
                      raise SystemExit(f'{path} hunk {number}: empty source anchor')
                  position = text.find(old, cursor)
                  if position < 0:
                      raise SystemExit(f'{path} hunk {number}: exact source anchor not found')
                  text = text[:position] + new + text[position + len(old):]
                  cursor = position + len(new)
              file_path.write_text(text)
              print(f'patched {path} ({len(hunks)} hunks)')
          PY

      - name: Validate target picker source
        shell: bash
        run: |
          node --check android/app/src/main/assets/riftbrowser-mcp-app.js
          node --check src/riftai-workspace.js
          grep -Fq 'ai.targets' android/app/src/main/java/com/riftos/app/MainActivity.kt
          grep -Fq 'collectChatTargets' android/app/src/main/assets/riftbrowser-mcp-app.js
          grep -Fq 'openTargetSearch' android/app/src/main/assets/riftbrowser-mcp-app.js
          grep -Fq 'Rift AI targets must stay on ChatGPT Web' android/app/src/main/java/com/riftos/app/RiftBrowserWindow.kt
          grep -Fq '0.9.2-rift-ai-chat-targets-alpha' android/app/build.gradle.kts
          if grep -Eqi 'api\.openai\.com|OPENAI_API_KEY|Authorization:[[:space:]]*Bearer' src/riftai-workspace.js android/app/src/main/assets/riftbrowser-mcp-app.js; then
            echo 'Direct model API path leaked into Rift AI target picker' >&2
            exit 1
          fi

      - name: Commit finalized feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/build.gradle.kts android/app/src/main/assets/riftbrowser-mcp-app.js android/app/src/main/java/com/riftos/app/MainActivity.kt android/app/src/main/java/com/riftos/app/RiftBrowserWindow.kt src/riftai-workspace.js styles.css README.md docs/PROJECT_STATUS.md docs/RIFT_AI_WORKSPACE.md docs/RIFT_BROWSER_MCP_APP.md
          git diff --cached --check
          git commit -m 'Android: add ChatGPT Web chat target picker'
          git push origin HEAD:main
