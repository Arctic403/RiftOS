name: Build RiftEngine Phase 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riftengine-pages.yml'
      - 'riftengine/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'sw.js'
      - 'manifest.webmanifest'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riftengine-phase1
  cancel-in-progress: true

jobs:
  prototype:
    name: Fast RiftEngine canvas prototype
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Install pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.0'
          actions-cache-folder: 'emsdk-cache'

      - name: Build RiftEngine port harness
        run: bash riftengine/tools/build-prototype.sh

      - name: Verify prototype
        run: |
          set -euxo pipefail
          test -s riftengine/dist/riftengine-core.js
          test -s riftengine/dist/riftengine-core.wasm
          test -s riftengine/engine/webcore.js
          ls -lh riftengine/dist/

      - name: Assemble Pages site
        run: |
          set -euxo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.riftengine-work/' \
            --exclude '_site/' \
            --exclude 'riftengine/src/' \
            --exclude 'riftengine/tools/' \
            --exclude 'riftengine/config/' \
            --exclude 'riftengine/cmake/' \
            --exclude 'riftengine/logs/' \
            --exclude 'riftengine/jsc-dist/' \
            --exclude '*.log'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  jsc:
    name: Real JavaScriptCore wasm bring-up
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RIFT_JOBS: '2'
      RIFTENGINE_WORK: ${{ runner.temp }}/riftengine-work
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            ruby-full bison flex gperf perl python3 curl xz-utils

      - name: Install pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.0'
          actions-cache-folder: 'emsdk-cache'

      - name: Build real JSCOnly wasm
        run: bash riftengine/tools/build-jsc-wasm.sh

      - name: Capture clean-port diff
        if: always()
        run: |
          mkdir -p riftengine/logs
          if [ -d "$RIFTENGINE_WORK/WebKit/.git" ]; then
            git -C "$RIFTENGINE_WORK/WebKit" diff --binary > riftengine/logs/webkit-rift-port.diff || true
            git -C "$RIFTENGINE_WORK/WebKit" status --short > riftengine/logs/webkit-rift-port-status.txt || true
          fi
          find riftengine/logs -maxdepth 1 -type f -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload JSC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftengine-jsc-diagnostics-${{ github.run_id }}
          path: riftengine/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JSC wasm smoke runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftengine-jsc-wasm-${{ github.run_id }}
          path: riftengine/jsc-dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy current RiftOS prototype
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prototype
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
