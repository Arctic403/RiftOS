name: Build and deploy RiftOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/riftengine-jsc.yml'
      - '.github/workflows/riftengine-webcore.yml'
      - 'riftengine/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    name: Build True OS site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: riftos-site-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Clone pinned RiftDev Editor source
        env:
          RIFTDEV_EDITOR_COMMIT: e25f31e45446fd30fd3d26346689c053f596f664
        run: |
          set -euxo pipefail
          rm -rf /tmp/riftdev-editor
          git init /tmp/riftdev-editor
          git -C /tmp/riftdev-editor remote add origin https://github.com/Arctic403/Editor.git
          git -C /tmp/riftdev-editor fetch --depth 1 origin "$RIFTDEV_EDITOR_COMMIT"
          git -C /tmp/riftdev-editor checkout --detach FETCH_HEAD
          rm -rf /tmp/riftdev-editor/.git
          test -s /tmp/riftdev-editor/index.html

      - name: Assemble RiftOS Pages site
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site/src _site/apps/riftdev

          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp -a src/. _site/src/

          # RiftDev is a read-only source clone. Only the staged RiftOS copy is
          # modified with our integration overlay.
          cp -a /tmp/riftdev-editor/. _site/apps/riftdev/
          cp src/riftdev-overlay.js _site/apps/riftdev/riftos-overlay.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_site/apps/riftdev/index.html')
          html = path.read_text(encoding='utf-8')
          script = '<script src="riftos-overlay.js?v=3"></script>'
          if script not in html:
              if '</body>' not in html:
                  raise SystemExit('RiftDev index.html has no closing body tag')
              html = html.replace('</body>', f'    {script}\n</body>')
              path.write_text(html, encoding='utf-8')
          PY
          test -s _site/apps/riftdev/riftos-overlay.js
          grep -F 'riftos-overlay.js?v=3' _site/apps/riftdev/index.html

          # The browser-engine source and heavyweight WASM builds are on hold.
          # Normal RiftOS UI changes no longer install Emscripten or rebuild
          # RiftEngine. Its dedicated workflows remain available separately.
          echo "Pages payload:"
          du -sh _site

          payload_bytes=$(du -sb _site | cut -f1)
          max_bytes=$((32 * 1024 * 1024))
          if [ "$payload_bytes" -gt "$max_bytes" ]; then
            echo "Pages payload is unexpectedly large: $payload_bytes bytes" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy current RiftOS
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: site
    concurrency:
      group: riftos-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
