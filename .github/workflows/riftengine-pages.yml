name: Build and deploy RiftOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/riftengine-jsc.yml'
      - 'riftengine/tools/build-jsc-wasm.sh'
      - 'riftengine/tools/build-icu-wasm.sh'
      - 'riftengine/tools/prepare-webkit.sh'
      - 'riftengine/tools/port-jsc-emscripten.py'
      - 'riftengine/config/pins.env'
      - 'riftengine/cmake/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prototype:
    name: Fast RiftOS + RiftEngine prototype
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: riftos-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Clone pinned RiftDev Editor source
        env:
          RIFTDEV_EDITOR_COMMIT: e25f31e45446fd30fd3d26346689c053f596f664
        run: |
          set -euxo pipefail
          rm -rf /tmp/riftdev-editor
          git init /tmp/riftdev-editor
          git -C /tmp/riftdev-editor remote add origin https://github.com/Arctic403/Editor.git
          git -C /tmp/riftdev-editor fetch --depth 1 origin "$RIFTDEV_EDITOR_COMMIT"
          git -C /tmp/riftdev-editor checkout --detach FETCH_HEAD
          rm -rf /tmp/riftdev-editor/.git
          test -s /tmp/riftdev-editor/index.html
          echo "RiftDev source pinned to $RIFTDEV_EDITOR_COMMIT"

      - name: Install pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.0'
          actions-cache-folder: 'emsdk-cache'

      - name: Build RiftEngine port harness
        run: bash riftengine/tools/build-prototype.sh

      - name: Stage preserved JSC wasm runtimes
        run: |
          set -euxo pipefail
          mkdir -p riftengine/jsc-dist riftengine/jsc-dist/custom

          # Stock JSC shell remains a compatibility fallback while the
          # persistent host is proven across iOS/Safari versions.
          if [ -s riftengine/prebuilt/jsc-v1/jsc.js ] && [ -s riftengine/prebuilt/jsc-v1/jsc.wasm ]; then
            cp riftengine/prebuilt/jsc-v1/jsc.js riftengine/jsc-dist/jsc.js
            cp riftengine/prebuilt/jsc-v1/jsc.wasm riftengine/jsc-dist/jsc.wasm
            ls -lh riftengine/jsc-dist/jsc.js riftengine/jsc-dist/jsc.wasm
          else
            echo 'Prebuilt stock JSC v1 is unavailable; deploying without stock fallback.'
          fi

          # Preferred browser runtime: tiny RiftEngine-owned host linked to
          # JavaScriptCore, with one long-lived JSGlobalContextRef.
          if [ -s riftengine/prebuilt/rift-jsc-host-v1/rift-jsc.js ] && [ -s riftengine/prebuilt/rift-jsc-host-v1/rift-jsc.wasm ]; then
            cp riftengine/prebuilt/rift-jsc-host-v1/rift-jsc.js riftengine/jsc-dist/custom/rift-jsc.js
            cp riftengine/prebuilt/rift-jsc-host-v1/rift-jsc.wasm riftengine/jsc-dist/custom/rift-jsc.wasm
            ls -lh riftengine/jsc-dist/custom/rift-jsc.js riftengine/jsc-dist/custom/rift-jsc.wasm
          else
            echo 'Persistent RiftJSC host has not been promoted yet; worker will use stock fallback.'
          fi

      - name: Verify prototype
        run: |
          set -euxo pipefail
          test -s riftengine/dist/riftengine-core.js
          test -s riftengine/dist/riftengine-core.wasm
          test -s riftengine/engine/webcore.js
          ls -lh riftengine/dist/

      - name: Assemble lean Pages site
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site/src _site/apps/riftdev _site/riftengine/engine _site/riftengine/dist _site/riftengine/jsc-dist/custom

          # RiftOS shell.
          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp -a src/. _site/src/

          # RiftDev starts as a pinned, read-only clone of Arctic403/Editor.
          # The original Editor repository is never modified. RiftOS adds its
          # own integration overlay only to this staged deployment copy.
          cp -a /tmp/riftdev-editor/. _site/apps/riftdev/
          cp src/riftdev-overlay.js _site/apps/riftdev/riftos-overlay.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_site/apps/riftdev/index.html')
          html = path.read_text(encoding='utf-8')
          script = '<script src="riftos-overlay.js?v=2"></script>'
          if script not in html:
              if '</body>' not in html:
                  raise SystemExit('RiftDev index.html has no closing body tag')
              html = html.replace('</body>', f'    {script}\n</body>')
              path.write_text(html, encoding='utf-8')
          PY
          test -s _site/apps/riftdev/riftos-overlay.js
          grep -F 'riftos-overlay.js?v=2' _site/apps/riftdev/index.html

          # Browser-facing RiftEngine JavaScript only.
          cp -a riftengine/engine/. _site/riftengine/engine/

          # Small prototype harness built in this workflow.
          cp riftengine/dist/riftengine-core.js _site/riftengine/dist/
          cp riftengine/dist/riftengine-core.wasm _site/riftengine/dist/

          # JSC runtimes only. Never publish WebKit trees, build caches,
          # sysroots, Emscripten SDKs, diagnostics, or duplicate prebuilts.
          if [ -s riftengine/jsc-dist/jsc.js ] && [ -s riftengine/jsc-dist/jsc.wasm ]; then
            cp riftengine/jsc-dist/jsc.js _site/riftengine/jsc-dist/
            cp riftengine/jsc-dist/jsc.wasm _site/riftengine/jsc-dist/
          fi
          if [ -s riftengine/jsc-dist/custom/rift-jsc.js ] && [ -s riftengine/jsc-dist/custom/rift-jsc.wasm ]; then
            cp riftengine/jsc-dist/custom/rift-jsc.js _site/riftengine/jsc-dist/custom/
            cp riftengine/jsc-dist/custom/rift-jsc.wasm _site/riftengine/jsc-dist/custom/rift-jsc.wasm
          fi

          echo 'Pages payload:'
          du -sh _site
          find _site -type f -printf '%s %p\n' | sort -nr | head -20

          # Guard against accidentally publishing build caches again.
          payload_bytes=$(du -sb _site | cut -f1)
          max_bytes=$((120 * 1024 * 1024))
          if [ "$payload_bytes" -gt "$max_bytes" ]; then
            echo "Pages payload is unexpectedly large: $payload_bytes bytes" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy current RiftOS
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prototype
    concurrency:
      group: riftos-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
