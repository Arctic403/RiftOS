name: Build and deploy RiftOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/riftengine-jsc.yml'
      - 'riftengine/tools/build-jsc-wasm.sh'
      - 'riftengine/tools/build-icu-wasm.sh'
      - 'riftengine/tools/prepare-webkit.sh'
      - 'riftengine/tools/port-jsc-emscripten.py'
      - 'riftengine/config/pins.env'
      - 'riftengine/cmake/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prototype:
    name: Fast RiftOS + RiftEngine prototype
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: riftos-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Install pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.0'
          actions-cache-folder: 'emsdk-cache'

      - name: Build RiftEngine port harness
        run: bash riftengine/tools/build-prototype.sh

      - name: Fetch preserved JSC wasm runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p riftengine/jsc-dist
          if gh release view riftengine-jsc-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download riftengine-jsc-v1 \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'jsc.js' \
              --pattern 'jsc.wasm' \
              --dir riftengine/jsc-dist
            ls -lh riftengine/jsc-dist
          else
            echo 'Preserved JSC release is not published yet; deploying prototype without it.'
          fi

      - name: Verify prototype
        run: |
          set -euxo pipefail
          test -s riftengine/dist/riftengine-core.js
          test -s riftengine/dist/riftengine-core.wasm
          test -s riftengine/engine/webcore.js
          ls -lh riftengine/dist/

      - name: Assemble Pages site
        run: |
          set -euxo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.riftengine-work/' \
            --exclude '_site/' \
            --exclude 'riftengine/src/' \
            --exclude 'riftengine/tools/' \
            --exclude 'riftengine/config/' \
            --exclude 'riftengine/cmake/' \
            --exclude 'riftengine/logs/' \
            --exclude '*.log'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy current RiftOS
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prototype
    concurrency:
      group: riftos-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
