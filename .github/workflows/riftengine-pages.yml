name: Build RiftEngine Pages experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riftengine-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riftengine-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo 'CPU:'
          nproc
          echo 'Memory:'
          free -h
          echo 'Disk:'
          df -h /
          node --version

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl cmake ninja-build make python3 pkg-config tar xz-utils unzip clang

      - name: Clone WebkitWasm non-pthread research port
        run: |
          git clone --depth 1 --branch non-pthread https://github.com/theogbob/WebkitWasm.git /tmp/WebkitWasm
          git -C /tmp/WebkitWasm rev-parse HEAD

      - name: Bootstrap WebKit, Emscripten and WASM dependencies
        working-directory: /tmp/WebkitWasm
        run: |
          bash tools/bootstrap.sh
          npm ci

      - name: Build local non-pthread WebCore/WASM
        working-directory: /tmp/WebkitWasm
        env:
          BIB_PTHREAD: '0'
          BIB_JOBS: '2'
        run: bash tools/build-webcore.sh

      - name: Verify generated engine
        working-directory: /tmp/WebkitWasm
        run: |
          test -s build/webcore/bin/embedder.js
          test -s build/webcore/bin/embedder.wasm
          test -s build/webcore/bin/bib-build-config.js
          ls -lh build/webcore/bin/

      - name: Assemble RiftOS static artifact
        run: |
          mkdir -p _site
          cp -a README.md index.html manifest.webmanifest styles.css sw.js src _site/
          mkdir -p _site/riftengine/engine
          cp -a /tmp/WebkitWasm/build/webcore/bin/. _site/riftengine/engine/
          mkdir -p _site/riftengine/upstream-web
          cp -a /tmp/WebkitWasm/web/. _site/riftengine/upstream-web/
          touch _site/.nojekyll
          echo 'RiftEngine payload:'
          du -sh _site/riftengine

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy RiftOS + RiftEngine to GitHub Pages
        uses: actions/deploy-pages@v4
