name: Build and deploy RiftEngine prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riftengine-pages.yml'
      - 'riftengine/**'
      - 'index.html'
      - 'styles.css'
      - 'src/**'
      - 'sw.js'
      - 'manifest.webmanifest'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riftengine-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.12'
          actions-cache-folder: 'emsdk-cache'

      - name: Build RiftEngine port-harness prototype
        run: bash riftengine/tools/build-prototype.sh

      - name: Verify prototype
        run: |
          set -euxo pipefail
          test -s riftengine/dist/riftengine-core.js
          test -s riftengine/dist/riftengine-core.wasm
          test -s riftengine/engine/webcore.js
          ls -lh riftengine/dist/

      - name: Assemble Pages site
        run: |
          set -euxo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.devcontainer/' \
            --exclude '_site/' \
            --exclude 'riftengine/src/' \
            --exclude 'riftengine/tools/' \
            --exclude 'riftengine/cmake/' \
            --exclude '*.log'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
