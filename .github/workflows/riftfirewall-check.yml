name: Validate RiftFirewall

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/riftbrowser-firewall.js'
      - 'src/riftbrowser-firewall-host.js'
      - 'src/riftbrowser-engines.js'
      - 'src/riftbrowser-kernel.js'
      - 'src/riftbrowser-ui.js'
      - 'src/riftbrowser-ui-runtime.js'
      - 'src/riftbrowser-ui.css'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/riftfirewall-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate firewall JavaScript
        run: |
          set -euxo pipefail
          node --check src/riftbrowser-firewall.js
          node --check src/riftbrowser-firewall-host.js
          node --check src/riftbrowser-engines.js
          node --check src/riftbrowser-kernel.js
          node --check src/riftbrowser-ui.js
          node --check src/riftbrowser-ui-runtime.js
          node --check sw.js
      - name: Validate firewall wiring
        run: |
          set -euxo pipefail
          grep -F './src/riftbrowser-firewall.js' index.html
          grep -F './src/riftbrowser-firewall.js' sw.js
          grep -F './src/riftbrowser-firewall-host.js' sw.js
          grep -F './src/riftbrowser-ui-runtime.js' sw.js
          grep -F 'import "./riftbrowser-ui-runtime.js"' src/riftbrowser-ui.js
          grep -F 'evaluateURL' src/riftbrowser-kernel.js
          grep -F 'runtimePolicy' src/riftbrowser-kernel.js
          grep -F 'FIREWALL_HOST_SCRIPT' src/riftbrowser-ui-runtime.js
          grep -F 'installTransportFirewall' src/riftbrowser-ui-runtime.js
          grep -F 'window.__riftFirewallTransport' src/riftbrowser-firewall-host.js
          grep -F 'WispWebSocket' src/riftbrowser-firewall-host.js
          grep -F 'networkEnabled:true' src/riftbrowser-firewall.js
          grep -F 'httpsOnly:true' src/riftbrowser-firewall.js
          grep -F 'blockPrivateHosts:true' src/riftbrowser-firewall.js
          grep -F 'blockSensitivePorts:true' src/riftbrowser-firewall.js
