name: Build RiftWebCore wasm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riftengine-webcore.yml'
      - 'riftengine/tools/build-webcore-wasm.sh'
      - 'riftengine/tools/build-libxml2-wasm.sh'
      - 'riftengine/tools/port-webcore-emscripten.py'
      - 'riftengine/webcore/**'
      - 'riftengine/cmake/RiftWebKitFeatures.cmake'

permissions:
  contents: read

concurrency:
  group: riftengine-webcore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webcore:
    name: Compile WebCore Gate 2
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RIFT_JOBS: '2'
      RIFTENGINE_WORK: /tmp/riftengine-webcore
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Install WebCore build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            ruby-full bison flex gperf perl python3 curl xz-utils

      - name: Install pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.0'
          actions-cache-folder: 'emsdk-cache'

      - name: Compile real WebCore target
        run: bash riftengine/tools/build-webcore-wasm.sh

      - name: Upload WebCore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftengine-webcore-diagnostics-${{ github.run_id }}
          path: riftengine/logs/webcore
          if-no-files-found: warn
          retention-days: 14
