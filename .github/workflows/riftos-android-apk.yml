name: Build RiftOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-apk]
    paths:
      - 'android/**'
      - 'src/**'
      - 'apps/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/riftos-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: riftos-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build + publish Samsung Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect native compatibility changes
        id: native-change
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            android/app/src/main/java \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/res \
            android/app/build.gradle.kts \
            android/build.gradle.kts \
            android/settings.gradle.kts \
            android/gradle.properties \
            android/scripts \
            .github/workflows/riftos-android-apk.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Ensure Android platform + build tools + NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865"
          NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          test -f "$NDK_ROOT/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          cmake --version | head -1

      - name: Set up cached Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build bundled local gpt-oss runtime
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x android/scripts/prepare-gpt-oss-runtime.sh
          bash android/scripts/prepare-gpt-oss-runtime.sh
          python3 android/scripts/patch-local-ai-dispatcher.py
          test -s android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          test -s android/app/src/main/jniLibs/x86_64/libllamaserver.so
          grep -F '"ai.local.info" -> localAi.info()' android/app/src/main/java/com/riftos/app/RiftNativeDispatcher.kt

      - name: Restore Android 8 emulator cache
        if: steps.native-change.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-26/google_apis/x86_64
          key: riftos-${{ runner.os }}-api26-google-apis-x86_64-v2

      - name: Restore RiftOS signing identity
        env:
          RIFTOS_KEYSTORE_B64: ${{ secrets.RIFTOS_KEYSTORE_B64 }}
          RIFTOS_KEYSTORE_PASSWORD: ${{ secrets.RIFTOS_KEYSTORE_PASSWORD }}
          RIFTOS_KEY_ALIAS: ${{ secrets.RIFTOS_KEY_ALIAS }}
          RIFTOS_KEY_PASSWORD: ${{ secrets.RIFTOS_KEY_PASSWORD }}
        run: |
          if [ -n "${RIFTOS_KEYSTORE_B64:-}" ]; then
            printf '%s' "$RIFTOS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/riftos-release.keystore"
            echo "RIFT_SIGN_STORE=$RUNNER_TEMP/riftos-release.keystore" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_STORE_PASS=${RIFTOS_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_ALIAS=${RIFTOS_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_KEY_PASS=${RIFTOS_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_MODE=production-secret" >> "$GITHUB_ENV"
          else
            base64 --decode android/riftos-debug.keystore.b64 > "$RUNNER_TEMP/riftos-alpha.keystore"
            echo "RIFT_SIGN_STORE=$RUNNER_TEMP/riftos-alpha.keystore" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_STORE_PASS=android" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_ALIAS=riftosdebug" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_KEY_PASS=android" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_MODE=alpha-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build unsigned RiftOS Android APK
        working-directory: android
        run: gradle --stacktrace --build-cache :app:assembleRelease

      - name: Align and sign Android 8+
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/RiftOS-Android-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/RiftOS-Android-debug.apk"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RIFT_SIGN_STORE" \
            --ks-key-alias "$RIFT_SIGN_ALIAS" \
            --ks-pass "pass:$RIFT_SIGN_STORE_PASS" \
            --key-pass "pass:$RIFT_SIGN_KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL"

      - name: Verify Samsung-native APK + local gpt-oss runtime
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          FINAL="$GITHUB_WORKSPACE/RiftOS-Android-debug.apk"
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$FINAL")"
          printf '%s\n' "$BADGING" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.riftos.app'"
          unzip -p "$FINAL" assets/www/index.html | grep -Fq "SAMSUNG ANDROID"
          unzip -p "$FINAL" assets/www/src/riftandroid-platform.js | grep -Fq "RiftLocalAI"
          unzip -l "$FINAL" | grep -Fq "lib/arm64-v8a/libllamaserver.so"
          unzip -l "$FINAL" | grep -Fq "lib/x86_64/libllamaserver.so"
          if unzip -l "$FINAL" | grep -Eqi 'pwa-ios|app-safari|manifest\.webmanifest|local-test-sw'; then
            echo "Web/iOS-only assets leaked into Android APK" >&2
            exit 1
          fi
          echo "Signing mode: $RIFT_SIGN_MODE"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftOS-android-debug
          path: RiftOS-Android-debug.apk
          if-no-files-found: error

      - name: Publish stable latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest RiftOS-Android-debug.apk --clobber
          else
            gh release create android-latest RiftOS-Android-debug.apk \
              --target "$GITHUB_SHA" \
              --title "RiftOS Android — Latest Debug" \
              --notes "Samsung/Android-native RiftOS alpha with local gpt-oss runtime. Android 8.0 / API 26+."
          fi

      - name: Optional install + launch smoke test on Android 8.0 / API 26
        if: steps.native-change.outputs.changed == 'true'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r "$GITHUB_WORKSPACE/RiftOS-Android-debug.apk"
            adb shell am start -W -n com.riftos.app/.MainActivity
            sleep 3
            adb shell pidof com.riftos.app
