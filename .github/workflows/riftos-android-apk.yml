name: Build RiftOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-apk]
    paths:
      - 'android/**'
      - 'src/**'
      - 'apps/**'
      - 'engines/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/riftos-android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build RiftOS debug APK
        working-directory: android
        run: gradle --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftOS-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RiftOS-Android-debug.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest RiftOS-Android-debug.apk --clobber
          else
            gh release create android-latest RiftOS-Android-debug.apk \
              --target "$GITHUB_SHA" \
              --title "RiftOS Android — Latest Debug" \
              --notes "Automatically updated from the android-apk branch."
          fi
