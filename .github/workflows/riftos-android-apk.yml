name: Build RiftOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-apk]
    paths:
      - 'android/**'
      - 'src/**'
      - 'apps/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/riftos-android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build + publish Samsung Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore RiftOS signing identity
        env:
          RIFTOS_KEYSTORE_B64: ${{ secrets.RIFTOS_KEYSTORE_B64 }}
          RIFTOS_KEYSTORE_PASSWORD: ${{ secrets.RIFTOS_KEYSTORE_PASSWORD }}
          RIFTOS_KEY_ALIAS: ${{ secrets.RIFTOS_KEY_ALIAS }}
          RIFTOS_KEY_PASSWORD: ${{ secrets.RIFTOS_KEY_PASSWORD }}
        run: |
          if [ -n "${RIFTOS_KEYSTORE_B64:-}" ]; then
            printf '%s' "$RIFTOS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/riftos-release.keystore"
            echo "RIFT_SIGN_STORE=$RUNNER_TEMP/riftos-release.keystore" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_STORE_PASS=${RIFTOS_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_ALIAS=${RIFTOS_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_KEY_PASS=${RIFTOS_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_MODE=production-secret" >> "$GITHUB_ENV"
          else
            base64 --decode android/riftos-debug.keystore.b64 > "$RUNNER_TEMP/riftos-alpha.keystore"
            echo "RIFT_SIGN_STORE=$RUNNER_TEMP/riftos-alpha.keystore" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_STORE_PASS=android" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_ALIAS=riftosdebug" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_KEY_PASS=android" >> "$GITHUB_ENV"
            echo "RIFT_SIGN_MODE=alpha-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build unsigned RiftOS Android APK
        working-directory: android
        run: gradle --stacktrace :app:assembleRelease

      - name: Align and sign Android 8+
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/RiftOS-Android-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/RiftOS-Android-debug.apk"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RIFT_SIGN_STORE" \
            --ks-key-alias "$RIFT_SIGN_ALIAS" \
            --ks-pass "pass:$RIFT_SIGN_STORE_PASS" \
            --key-pass "pass:$RIFT_SIGN_KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL"

      - name: Verify Samsung-native APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          FINAL="$GITHUB_WORKSPACE/RiftOS-Android-debug.apk"
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$FINAL")"
          printf '%s\n' "$BADGING" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'26'"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.riftos.app'"
          unzip -p "$FINAL" assets/www/index.html | grep -Fq "SAMSUNG ANDROID"
          if unzip -l "$FINAL" | grep -Eqi 'pwa-ios|app-safari|manifest\.webmanifest|local-test-sw'; then
            echo "Web/iOS-only assets leaked into Android APK" >&2
            exit 1
          fi
          echo "Signing mode: $RIFT_SIGN_MODE"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftOS-android-debug
          path: RiftOS-Android-debug.apk
          if-no-files-found: error

      - name: Publish stable latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest RiftOS-Android-debug.apk --clobber
          else
            gh release create android-latest RiftOS-Android-debug.apk \
              --target "$GITHUB_SHA" \
              --title "RiftOS Android — Latest Debug" \
              --notes "Samsung/Android-native RiftOS alpha. Android 8.0 / API 26+."
          fi

      - name: Optional install + launch smoke test on Android 8.0 / API 26
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r "$GITHUB_WORKSPACE/RiftOS-Android-debug.apk"
            adb shell am start -W -n com.riftos.app/.MainActivity
            sleep 3
            adb shell pidof com.riftos.app
