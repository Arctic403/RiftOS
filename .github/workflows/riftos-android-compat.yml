name: RiftOS Android Compatibility Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 0'

permissions:
  contents: read

jobs:
  android:
    name: API ${{ matrix.api }} install + launch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: android
        run: gradle --stacktrace :app:assembleDebug
      - name: Install and launch
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -W -n com.riftos.app/.MainActivity
            sleep 2
            adb shell pidof com.riftos.app
