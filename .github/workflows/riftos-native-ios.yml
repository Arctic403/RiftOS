# Native-only CI: compile Swift on current Apple tooling whenever the iOS host changes.
name: Build RiftOS Native iOS shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/riftos-native-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/ios/**'
      - '.github/workflows/riftos-native-ios.yml'

permissions:
  contents: read

concurrency:
  group: riftos-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-shell:
    name: Validate Swift native host
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Select current Xcode
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        working-directory: native/ios
        run: |
          set -euxo pipefail
          xcodebuild \
            -project RiftOSNative.xcodeproj \
            -scheme RiftOSNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/RiftOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee "$RUNNER_TEMP/riftos-native-simulator-xcodebuild.log"

          test -d "$RUNNER_TEMP/RiftOSDerivedData/Build/Products/Debug-iphonesimulator/RiftOSNative.app"

      - name: Build unsigned iPhone target
        working-directory: native/ios
        run: |
          set -euxo pipefail
          xcodebuild \
            -project RiftOSNative.xcodeproj \
            -scheme RiftOSNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RiftOSDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee "$RUNNER_TEMP/riftos-native-device-xcodebuild.log"

          app="$RUNNER_TEMP/RiftOSDeviceDerivedData/Build/Products/Release-iphoneos/RiftOSNative.app"
          test -d "$app"
          rm -rf "$RUNNER_TEMP/RiftOSIPA"
          mkdir -p "$RUNNER_TEMP/RiftOSIPA/Payload"
          cp -R "$app" "$RUNNER_TEMP/RiftOSIPA/Payload/RiftOSNative.app"
          (
            cd "$RUNNER_TEMP/RiftOSIPA"
            /usr/bin/zip -qry "$RUNNER_TEMP/RiftOSNative-unsigned-device.ipa" Payload
          )
          test -s "$RUNNER_TEMP/RiftOSNative-unsigned-device.ipa"

      - name: Upload native builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiftOSNative-builds-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RiftOSDerivedData/Build/Products/Debug-iphonesimulator/RiftOSNative.app
            ${{ runner.temp }}/RiftOSNative-unsigned-device.ipa
            ${{ runner.temp }}/riftos-native-simulator-xcodebuild.log
            ${{ runner.temp }}/riftos-native-device-xcodebuild.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RiftOSNative-failed-build-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/riftos-native-simulator-xcodebuild.log
            ${{ runner.temp }}/riftos-native-device-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
