# Optional native capability-host validation.
# RiftKernel/WebKit is the primary unsigned runtime; this workflow is manual-only.
name: Optional RiftOS Native iOS host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-host:
    name: Validate optional Swift capability host
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Validate optional-host boundary
        run: |
          set -euxo pipefail
          test -s native/ios/project.yml
          test -s native/ios/RiftOSNative/RiftBrowser.swift
          test -s native/ios/RiftOSNative/RiftOSWebView.swift
          test -s native/ios/RiftOSNative/RiftNativeBridge.swift
          grep -F 'preferredContentMode' native/ios/RiftOSNative/RiftBrowser.swift
          grep -F 'riftos:///index.html' native/ios/RiftOSNative/RiftOSWebView.swift
          grep -F 'optional' README.md
          grep -F 'appSigningRequiredForKernel:false' src/riftruntime.js

      - name: Select current Xcode
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        working-directory: native/ios
        run: |
          set -euxo pipefail
          xcodebuild \
            -project RiftOSNative.xcodeproj \
            -scheme RiftOSNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/RiftOSDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee "$RUNNER_TEMP/riftos-native-simulator-xcodebuild.log"

      - name: Build unsigned iPhone target
        working-directory: native/ios
        run: |
          set -euxo pipefail
          xcodebuild \
            -project RiftOSNative.xcodeproj \
            -scheme RiftOSNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RiftOSDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee "$RUNNER_TEMP/riftos-native-device-xcodebuild.log"

      - name: Upload optional host build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftOS-optional-native-host-${{ github.sha }}
          path: |
            ${{ runner.temp }}/riftos-native-simulator-xcodebuild.log
            ${{ runner.temp }}/riftos-native-device-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
