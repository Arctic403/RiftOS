name: Build and upload RiftOS Native to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 0.1.0)
        required: true
        default: '0.1.0'
      upload:
        description: Upload the signed build to App Store Connect/TestFlight
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: riftos-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Sign RiftOS Native and deliver to TestFlight
    runs-on: macos-26
    timeout-minutes: 40
    env:
      PRODUCT_BUNDLE_ID: com.riftos.native
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Validate required signing secrets
        run: |
          set -euo pipefail
          missing=0
          for name in \
            IOS_CERTIFICATE_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            APPSTORE_CONNECT_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID \
            APPSTORE_CONNECT_PRIVATE_KEY_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings → Secrets and variables → Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Select current Xcode
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Decode signing material
        env:
          CERT_PATH: ${{ runner.temp }}/RiftOSDistribution.p12
          PROFILE_PATH: ${{ runner.temp }}/RiftOSAppStore.mobileprovision
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          items = [
              ('IOS_CERTIFICATE_BASE64', 'CERT_PATH'),
              ('IOS_PROVISIONING_PROFILE_BASE64', 'PROFILE_PATH'),
              ('APPSTORE_CONNECT_PRIVATE_KEY_BASE64', 'ASC_KEY_PATH'),
          ]
          for source, target in items:
              raw = os.environ[source].strip()
              try:
                  data = base64.b64decode(raw, validate=True)
              except Exception as exc:
                  raise SystemExit(f'{source} is not valid base64: {exc}')
              with open(os.environ[target], 'wb') as handle:
                  handle.write(data)
          PY
          chmod 600 "$CERT_PATH" "$PROFILE_PATH" "$ASC_KEY_PATH"

      - name: Install signing certificate and provisioning profile
        env:
          CERT_PATH: ${{ runner.temp }}/RiftOSDistribution.p12
          PROFILE_PATH: ${{ runner.temp }}/RiftOSAppStore.mobileprovision
          PROFILE_PLIST: ${{ runner.temp }}/RiftOSAppStore.plist
          KEYCHAIN_PATH: ${{ runner.temp }}/riftos-signing.keychain-db
          KEYCHAIN_PASSWORD: riftos-ci-keychain-${{ github.run_id }}
        run: |
          set -euxo pipefail

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_PATTERN="${PROFILE_APP_ID#${TEAM_ID}.}"

          case "$PRODUCT_BUNDLE_ID" in
            $PROFILE_PATTERN) ;;
            *)
              echo "::error::Provisioning profile application identifier '$PROFILE_PATTERN' does not cover '$PRODUCT_BUNDLE_ID'."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          IDENTITY_SHA=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eo '[A-F0-9]{40}' | head -n 1 || true)
          if [ -z "$IDENTITY_SHA" ]; then
            echo "::error::No usable Apple code-signing identity was found in the imported certificate."
            exit 1
          fi

          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "IDENTITY_SHA=$IDENTITY_SHA"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          echo "Signing profile: $PROFILE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Team: $TEAM_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle ID: $PRODUCT_BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_SOURCE: ${{ runner.temp }}/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_SOURCE" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"

      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml

      - name: Archive signed iPhone build
        working-directory: native/ios
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHIVE_PATH: ${{ runner.temp }}/RiftOSNative.xcarchive
        run: |
          set -euxo pipefail
          xcodebuild \
            -project RiftOSNative.xcodeproj \
            -scheme RiftOSNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$PRODUCT_BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY_SHA" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive | tee "$RUNNER_TEMP/riftos-testflight-archive.log"

          test -d "$ARCHIVE_PATH/Products/Applications/RiftOSNative.app"
          codesign --verify --deep --strict --verbose=2 "$ARCHIVE_PATH/Products/Applications/RiftOSNative.app"

      - name: Export App Store Connect IPA
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/RiftOSNative.xcarchive
          EXPORT_PATH: ${{ runner.temp }}/RiftOSExport
          EXPORT_OPTIONS: ${{ runner.temp }}/RiftOSExportOptions.plist
        run: |
          set -euxo pipefail
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$PRODUCT_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            | tee "$RUNNER_TEMP/riftos-testflight-export.log"

          IPA=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Validate with App Store Connect
        if: ${{ inputs.upload }}
        run: |
          set -euxo pipefail
          xcrun altool \
            --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID" \
            | tee "$RUNNER_TEMP/riftos-testflight-validate.log"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          set -euxo pipefail
          xcrun altool \
            --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID" \
            | tee "$RUNNER_TEMP/riftos-testflight-upload.log"

          echo "✅ RiftOS Native was uploaded to App Store Connect. Apple still needs to process the build before it appears in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-sensitive delivery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiftOSNative-TestFlight-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/riftos-testflight-archive.log
            ${{ runner.temp }}/riftos-testflight-export.log
            ${{ runner.temp }}/riftos-testflight-validate.log
            ${{ runner.temp }}/riftos-testflight-upload.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean signing material
        if: always()
        run: |
          set +e
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf \
            "$HOME/.appstoreconnect/private_keys" \
            "$RUNNER_TEMP/RiftOSDistribution.p12" \
            "$RUNNER_TEMP/RiftOSAppStore.mobileprovision" \
            "$RUNNER_TEMP/RiftOSAppStore.plist" \
            "$RUNNER_TEMP/RiftOSNative.xcarchive" \
            "$RUNNER_TEMP/RiftOSExport"
