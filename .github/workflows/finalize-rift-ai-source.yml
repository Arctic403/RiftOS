name: Finalize Rift AI source

on:
  push:
    branches: [main]
    paths:
      - '.github/rift-ai-finalize/**'

permissions:
  contents: write

concurrency:
  group: rift-ai-source-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply reviewed Rift AI source patches
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/rift-ai-finalize/MainActivity.patch
          git apply --check .github/rift-ai-finalize/RiftAiJournal.patch
          git apply --check .github/rift-ai-finalize/RiftBrowserWindow.patch
          git apply .github/rift-ai-finalize/MainActivity.patch
          git apply .github/rift-ai-finalize/RiftAiJournal.patch
          git apply .github/rift-ai-finalize/RiftBrowserWindow.patch

          test "$(git hash-object android/app/src/main/java/com/riftos/app/MainActivity.kt)" = "057c04948e1be1eb256bc41e3755ede830983b23"
          test "$(git hash-object android/app/src/main/java/com/riftos/app/RiftAiJournal.kt)" = "8c1468d08e7c0e1d5221145fc78f19382f383fc8"
          test "$(git hash-object android/app/src/main/java/com/riftos/app/RiftBrowserWindow.kt)" = "acdac8a1eb5abbe498c457e12215b813eaceabcc"

      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/riftos/app/MainActivity.kt \
                  android/app/src/main/java/com/riftos/app/RiftAiJournal.kt \
                  android/app/src/main/java/com/riftos/app/RiftBrowserWindow.kt
          git commit -m "Android: finish ChatGPT Web Rift AI workspace"
          git push origin HEAD:main
