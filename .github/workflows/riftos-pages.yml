name: Build and deploy RiftOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/riftwebkit-poc.yml'
      - '.github/workflows/riftwebkit-mobile.yml'
      - 'engines/webkit-poc/riftwebkit-probe.cpp'
      - 'engines/webkit-poc/riftwebkit-embedder.cmake'
      - 'engines/webkit-poc/build-riftwebkit.sh'

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  site:
    name: Validate unsigned RiftKernel/RiftWebKit runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: riftos-site-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate RiftOS JavaScript
        run: |
          set -euxo pipefail
          node --check src/riftcore.js
          node --check src/riftworkspace-web.js
          node --check src/riftruntime.js
          node --check src/riftbrowser-engines.js
          node --check src/riftbrowser-kernel.js
          node --check src/riftbrowser-ui.js
          node --check src/riftapps.js
          node --check src/riftapps-files.js
          node --check src/riftdev-host.js
          node --check src/riftdev-overlay.js
          node --check src/riftgit.js
          node --check src/riftos.js
          node --check sw.js

      - name: Validate RiftKernel browser architecture
        run: |
          set -euxo pipefail
          grep -F './src/riftworkspace-web.js' index.html
          grep -F './src/riftbrowser-engines.js' index.html
          grep -F './src/riftruntime.js' index.html
          grep -F 'navigator.storage?.getDirectory' src/riftcore.js
          grep -F 'mode:"local-sandbox"' src/riftworkspace-web.js
          grep -F 'window.RiftWorkspaceJSON' src/riftworkspace-web.js
          grep -F 'RiftOS core and RiftWorkspace MUST NOT require the RiftWebKit WASM engine to boot.' docs/RIFTWORKSPACE_WEB_ARCHITECTURE.md
          grep -F 'RiftOS core MUST NOT require WebAssembly to boot.' docs/RIFTBROWSER_ARCHITECTURE.md
          grep -F 'ENGINE_ID="riftwebkit"' src/riftbrowser-engines.js
          grep -F 'engine-manifest.json' src/riftbrowser-engines.js
          grep -F 'stableBrowser:false' src/riftbrowser-kernel.js
          grep -F 'BACKENDS=["riftwebkit"]' src/riftbrowser-kernel.js
          grep -F 'mode:"unavailable"' src/riftbrowser-kernel.js
          grep -F '/engines/webkit/' sw.js
          grep -F 'workspaceJSON' src/riftruntime.js
          grep -F 'riftkernel-webkit' src/riftruntime.js
          grep -F 'appSigningRequiredForKernel:false' src/riftruntime.js
          grep -F '"display":"standalone"' manifest.webmanifest
          grep -F './src/riftbrowser-engines.js' sw.js
          grep -F './src/riftworkspace-web.js' sw.js
          grep -F './src/riftruntime.js' sw.js
          grep -F 'unsigned, WebKit-hosted user-space operating environment' README.md
          grep -F 'RiftKernel first' docs/TRUE_OS_ARCHITECTURE.md
          grep -F 'Unsigned WebKit Runtime Validation' docs/UNSIGNED_WEBKIT_RUNTIME.md

          if grep -n -E 'wasm-gecko|native-webkit|Gecko WASM' src/riftbrowser-engines.js src/riftbrowser-kernel.js src/riftbrowser-ui.js; then
            echo 'Dead-end Gecko/native RiftBrowser backend references remain.' >&2
            exit 1
          fi

          if grep -n -E 'web-transport|openWithWebTransport|removeDangerousMarkup|DOMParser|srcdoc' src/riftbrowser-kernel.js src/riftbrowser-ui.js; then
            echo 'Removed legacy CORS/srcdoc RiftBrowser transport was reintroduced.' >&2
            exit 1
          fi

      - name: Clone pinned RiftDev Editor source
        env:
          RIFTDEV_EDITOR_COMMIT: e25f31e45446fd30fd3d26346689c053f596f664
        run: |
          set -euxo pipefail
          rm -rf /tmp/riftdev-editor
          git init /tmp/riftdev-editor
          git -C /tmp/riftdev-editor remote add origin https://github.com/Arctic403/Editor.git
          git -C /tmp/riftdev-editor fetch --depth 1 origin "$RIFTDEV_EDITOR_COMMIT"
          git -C /tmp/riftdev-editor checkout --detach FETCH_HEAD
          rm -rf /tmp/riftdev-editor/.git
          test -s /tmp/riftdev-editor/index.html

      - name: Sync pinned RiftDev mirror into RiftOS
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf apps/riftdev
          mkdir -p apps/riftdev
          cp -a /tmp/riftdev-editor/. apps/riftdev/
          cp src/riftdev-overlay.js apps/riftdev/riftos-overlay.js

          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/riftdev/index.html')
          html = path.read_text(encoding='utf-8')
          script = '<script src="riftos-overlay.js?v=3"></script>'
          if script not in html:
              if '</body>' not in html:
                  raise SystemExit('RiftDev index.html has no closing body tag')
              html = html.replace('</body>', f'    {script}\n</body>')
              path.write_text(html, encoding='utf-8')
          PY

          test -s apps/riftdev/index.html
          test -s apps/riftdev/riftos-overlay.js
          grep -F 'riftos-overlay.js?v=3' apps/riftdev/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/riftdev

          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Pinned RiftDev mirror is already current.'
          else
            git commit -m 'Sync pinned RiftDev runtime mirror'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch RiftWebKit engine package
        env:
          RIFTWEBKIT_MOBILE_URL: https://github.com/Arctic403/RiftOS/releases/download/riftwebkit-mobile-v1/riftwebkit-mobile-v1.tar.gz
          RIFTWEBKIT_PROOF_URL: https://github.com/Arctic403/RiftOS/releases/download/riftwebkit-poc-v1/riftwebkit-poc-v1.tar.gz
        run: |
          set -euxo pipefail
          rm -rf /tmp/riftwebkit-package /tmp/riftwebkit-stage /tmp/riftwebkit.tar.gz
          mkdir -p /tmp/riftwebkit-package /tmp/riftwebkit-stage

          if curl -fL --retry 2 --retry-delay 1 "$RIFTWEBKIT_MOBILE_URL" -o /tmp/riftwebkit.tar.gz; then
            echo 'Using full RiftWebKit Mobile release.'
            tar -xzf /tmp/riftwebkit.tar.gz -C /tmp/riftwebkit-package
            packaged_manifest=$(find /tmp/riftwebkit-package -type f -name engine-manifest.json | head -n1)
            test -n "$packaged_manifest" && test -s "$packaged_manifest"
            package_root=$(dirname "$packaged_manifest")
            cp -a "$package_root/." /tmp/riftwebkit-stage/
            test -s /tmp/riftwebkit-stage/index.html
            test -s /tmp/riftwebkit-stage/engine/embedder.js
            test -s /tmp/riftwebkit-stage/engine/embedder.wasm
            grep -F '"id": "riftwebkit-mobile"' /tmp/riftwebkit-stage/engine-manifest.json
          else
            echo 'Full mobile release is not published yet; using the proven RiftWebKit proof artifact.'
            rm -rf /tmp/riftwebkit-package /tmp/riftwebkit-stage /tmp/riftwebkit.tar.gz
            mkdir -p /tmp/riftwebkit-package /tmp/riftwebkit-stage
            curl -fL --retry 3 --retry-delay 2 "$RIFTWEBKIT_PROOF_URL" -o /tmp/riftwebkit.tar.gz
            tar -xzf /tmp/riftwebkit.tar.gz -C /tmp/riftwebkit-package
            packaged_manifest=$(find /tmp/riftwebkit-package -type f -name engine-manifest.json | head -n1)
            test -n "$packaged_manifest" && test -s "$packaged_manifest"
            package_root=$(dirname "$packaged_manifest")
            cp -a "$package_root/." /tmp/riftwebkit-stage/
            cp engines/webkit-poc/index.html /tmp/riftwebkit-stage/index.html
            test -s /tmp/riftwebkit-stage/runtime/riftwebkit.js
            test -s /tmp/riftwebkit-stage/runtime/riftwebkit.wasm
            grep -F '"id": "riftwebkit-poc"' /tmp/riftwebkit-stage/engine-manifest.json
          fi

          test -s /tmp/riftwebkit-stage/index.html
          test -s /tmp/riftwebkit-stage/engine-manifest.json
          cat /tmp/riftwebkit-stage/engine-manifest.json
          du -sh /tmp/riftwebkit-stage

      - name: Assemble RiftOS WebKit runtime
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site/src _site/apps/riftdev _site/engines/webkit

          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp -a src/. _site/src/
          cp -a apps/riftdev/. _site/apps/riftdev/
          cp -a /tmp/riftwebkit-stage/. _site/engines/webkit/

          test -s _site/src/riftcore.js
          test -s _site/src/riftworkspace-web.js
          test -s _site/src/riftruntime.js
          test -s _site/src/riftbrowser-engines.js
          test -s _site/src/riftbrowser-kernel.js
          test -s _site/src/riftbrowser-ui.js
          test -s _site/src/riftbrowser-ui.css
          test -s _site/apps/riftdev/index.html
          test -s _site/apps/riftdev/riftos-overlay.js
          test -s _site/engines/webkit/index.html
          test -s _site/engines/webkit/engine-manifest.json
          grep -E '"id": "riftwebkit-(mobile|poc)"' _site/engines/webkit/engine-manifest.json
          grep -F 'riftos-overlay.js?v=3' _site/apps/riftdev/index.html

          echo 'RiftKernel payload with one RiftWebKit browser engine:'
          du -sh _site
          payload_bytes=$(du -sb _site | cut -f1)
          max_bytes=$((768 * 1024 * 1024))
          if [ "$payload_bytes" -gt "$max_bytes" ]; then
            echo "RiftOS payload is unexpectedly large: $payload_bytes bytes" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for legacy branch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_id=""
          for _ in $(seq 1 8); do
            legacy_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | .id' | head -n1 || true)
            if [ -n "$legacy_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$legacy_id" ]; then
            echo 'No legacy branch Pages deployment detected; generated artifact can deploy now.'
            exit 0
          fi
          echo "Waiting for legacy Pages deployment $legacy_id before entering the github-pages environment."
          for _ in $(seq 1 120); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$legacy_id" --jq '.status')
            if [ "$status" = "completed" ]; then
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$legacy_id" --jq '.conclusion')
              echo "Legacy Pages deployment finished: $conclusion"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for legacy Pages deployment $legacy_id" >&2
          exit 1

      - name: Redeploy mirror commit
        if: steps.mirror.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run riftos-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    name: Deploy current RiftOS
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: site
    timeout-minutes: 10
    concurrency:
      group: riftos-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy generated RiftOS artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed RiftWebKit manifest
        run: |
          set -euxo pipefail
          base='${{ steps.deployment.outputs.page_url }}'
          curl -fL --retry 12 --retry-delay 2 --retry-all-errors "${base}engines/webkit/engine-manifest.json" -o /tmp/live-riftwebkit-manifest.json
          grep -E '"id": "riftwebkit-(mobile|poc)"' /tmp/live-riftwebkit-manifest.json
          grep -F '"available": true' /tmp/live-riftwebkit-manifest.json
