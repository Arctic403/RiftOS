name: Promote RiftEngine JSC v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-jsc-v1.yml'

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Preserve successful JSC wasm artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download successful engine artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9717472558'
        run: |
          set -euxo pipefail
          rm -rf /tmp/rift-jsc-v1
          mkdir -p /tmp/rift-jsc-v1
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/rift-jsc-v1.zip
          unzip -q /tmp/rift-jsc-v1.zip -d /tmp/rift-jsc-v1
          test -s /tmp/rift-jsc-v1/jsc.js
          test -s /tmp/rift-jsc-v1/jsc.wasm
          ls -lh /tmp/rift-jsc-v1/jsc.js /tmp/rift-jsc-v1/jsc.wasm

      - name: Commit immutable prebuilt engine
        run: |
          set -euxo pipefail
          mkdir -p riftengine/prebuilt/jsc-v1
          cp /tmp/rift-jsc-v1/jsc.js riftengine/prebuilt/jsc-v1/jsc.js
          cp /tmp/rift-jsc-v1/jsc.wasm riftengine/prebuilt/jsc-v1/jsc.wasm
          printf '%s\n' \
            'RiftEngine JSC wasm v1' \
            'Source run: 33260852535' \
            'Source artifact: 9717472558' \
            'Source commit: 5b81034050881b6935ab8bcbe1ddf8bd876821b9' \
            > riftengine/prebuilt/jsc-v1/BUILD.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riftengine/prebuilt/jsc-v1
          if git diff --cached --quiet; then
            echo 'Prebuilt JSC v1 is already preserved.'
            exit 0
          fi
          git commit -m 'Preserve successful RiftEngine JSC wasm v1'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
