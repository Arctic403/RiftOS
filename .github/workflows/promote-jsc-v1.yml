name: Promote persistent RiftJSC host v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-jsc-v1.yml'

permissions:
  actions: write
  contents: write

jobs:
  promote:
    name: Preserve proven persistent RiftJSC host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download green persistent-host artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9720424810'
        run: |
          set -euxo pipefail
          rm -rf /tmp/rift-jsc-host-v1 /tmp/rift-jsc-host-v1.zip
          mkdir -p /tmp/rift-jsc-host-v1
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/rift-jsc-host-v1.zip
          unzip -q /tmp/rift-jsc-host-v1.zip -d /tmp/rift-jsc-host-v1
          test -s /tmp/rift-jsc-host-v1/custom/rift-jsc.js
          test -s /tmp/rift-jsc-host-v1/custom/rift-jsc.wasm
          test -s /tmp/rift-jsc-host-v1/custom/persistence-smoke.cjs
          ls -lh /tmp/rift-jsc-host-v1/custom/rift-jsc.js /tmp/rift-jsc-host-v1/custom/rift-jsc.wasm

      - name: Re-run persistent context gate
        run: |
          set -euxo pipefail
          (
            cd /tmp/rift-jsc-host-v1/custom
            node persistence-smoke.cjs
          ) | tee /tmp/rift-jsc-host-v1-smoke.txt
          grep -F 'RIFT_HOST_PERSISTENCE=42' /tmp/rift-jsc-host-v1-smoke.txt
          grep -F 'RIFT_HOST_RESET=undefined' /tmp/rift-jsc-host-v1-smoke.txt

      - name: Commit immutable persistent host
        run: |
          set -euxo pipefail
          mkdir -p riftengine/prebuilt/rift-jsc-host-v1
          cp /tmp/rift-jsc-host-v1/custom/rift-jsc.js riftengine/prebuilt/rift-jsc-host-v1/rift-jsc.js
          cp /tmp/rift-jsc-host-v1/custom/rift-jsc.wasm riftengine/prebuilt/rift-jsc-host-v1/rift-jsc.wasm
          printf '%s\n' \
            'RiftEngine persistent RiftJSC host v1' \
            'Source run: 33270832073' \
            'Source artifact: 9720424810' \
            'Source commit: e805b92819948cb6102a38f2bab5aca02906dcb9' \
            'Persistence: RIFT_HOST_PERSISTENCE=42' \
            'Reset: RIFT_HOST_RESET=undefined' \
            > riftengine/prebuilt/rift-jsc-host-v1/BUILD.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riftengine/prebuilt/rift-jsc-host-v1
          if git diff --cached --quiet; then
            echo 'Persistent RiftJSC host v1 is already preserved.'
          else
            git commit -m 'Preserve persistent RiftJSC host v1'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Redeploy current RiftOS with promoted host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh workflow run riftengine-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
