name: Build RiftEngine JSC wasm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/riftengine-jsc.yml'
      - 'riftengine/tools/build-jsc-wasm.sh'
      - 'riftengine/tools/build-icu-wasm.sh'
      - 'riftengine/tools/prepare-webkit.sh'
      - 'riftengine/tools/port-jsc-emscripten.py'
      - 'riftengine/config/pins.env'
      - 'riftengine/cmake/**'

permissions:
  contents: write

concurrency:
  group: riftengine-jsc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jsc:
    name: Build versioned JavaScriptCore wasm
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RIFT_JOBS: '2'
      RIFTENGINE_WORK: /tmp/riftengine-work
    steps:
      - name: Checkout RiftOS
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            ruby-full bison flex gperf perl python3 curl xz-utils

      - name: Install pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.0'
          actions-cache-folder: 'emsdk-cache'

      - name: Build real JSCOnly wasm
        run: bash riftengine/tools/build-jsc-wasm.sh

      - name: Verify JSC runtime
        run: |
          set -euxo pipefail
          test -s riftengine/jsc-dist/jsc.js
          test -s riftengine/jsc-dist/jsc.wasm
          node riftengine/jsc-dist/jsc.js -e 'print("RIFT_JSC_RELEASE=" + (20 + 22));' | tee /tmp/rift-jsc-smoke.txt
          grep -F 'RIFT_JSC_RELEASE=42' /tmp/rift-jsc-smoke.txt
          grep -F 'Module["callMain"]' riftengine/jsc-dist/jsc.js
          ls -lh riftengine/jsc-dist/jsc.js riftengine/jsc-dist/jsc.wasm

      - name: Capture clean-port diff
        if: always()
        run: |
          mkdir -p riftengine/logs
          if [ -d "$RIFTENGINE_WORK/WebKit/.git" ]; then
            git -C "$RIFTENGINE_WORK/WebKit" diff --binary > riftengine/logs/webkit-rift-port.diff || true
            git -C "$RIFTENGINE_WORK/WebKit" status --short > riftengine/logs/webkit-rift-port-status.txt || true
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftengine-jsc-diagnostics-${{ github.run_id }}
          path: riftengine/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftengine-jsc-wasm-${{ github.run_id }}
          path: riftengine/jsc-dist
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable engine release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: riftengine-jsc-${{ github.sha }}
        run: |
          set -euxo pipefail
          gh release create "$TAG" \
            riftengine/jsc-dist/jsc.js \
            riftengine/jsc-dist/jsc.wasm \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RiftEngine JSC wasm ${GITHUB_SHA::12}" \
            --notes "Pinned JSCOnly/Emscripten runtime produced by run $GITHUB_RUN_ID."
