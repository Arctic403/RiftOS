name: One-time native iOS bookmark hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-ios-bookmark-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch iOS bookmark restoration
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('native/ios/RiftOSNative/RiftNativeBridge.swift')
          source = path.read_text(encoding='utf-8')
          old = '                    options: [.withSecurityScope],'
          new = '''                    // `.withSecurityScope` is macOS-only. On iOS the document-picker\n                    // bookmark is resolved normally, then access is activated below.\n                    options: [],'''
          if old not in source:
              raise SystemExit('Expected iOS-incompatible bookmark option was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          grep -F 'options: [],' native/ios/RiftOSNative/RiftNativeBridge.swift
          ! grep -F 'options: [.withSecurityScope]' native/ios/RiftOSNative/RiftNativeBridge.swift

      - name: Commit fix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/ios/RiftOSNative/RiftNativeBridge.swift
          git commit -m 'Fix iOS security-scoped bookmark restore'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
