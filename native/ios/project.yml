name: RiftOSNative
options:
  bundleIdPrefix: com.riftos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    VERSIONING_SYSTEM: apple-generic
targets:
  RiftOSNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RiftOSNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riftos.native
        PRODUCT_NAME: RiftOSNative
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RiftOS
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Bundle RiftOS kernel shell
        shell: /bin/bash
        script: |
          set -euo pipefail
          ROOT="$(cd "$SRCROOT/../.." && pwd)"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Web"

          rm -rf "$DEST"
          mkdir -p "$DEST/src" "$DEST/apps"

          cp "$ROOT/index.html" "$DEST/index.html"
          cp "$ROOT/styles.css" "$DEST/styles.css"
          cp "$ROOT/manifest.webmanifest" "$DEST/manifest.webmanifest"
          cp "$ROOT/sw.js" "$DEST/sw.js"
          cp -R "$ROOT/src/." "$DEST/src/"

          if [ -d "$ROOT/apps/riftdev" ]; then
            mkdir -p "$DEST/apps/riftdev"
            cp -R "$ROOT/apps/riftdev/." "$DEST/apps/riftdev/"
          fi

          test -s "$DEST/index.html"
          test -s "$DEST/src/riftcore.js"
          test -s "$DEST/src/riftbrowser-kernel.js"
    scheme:
      testTargets: []
