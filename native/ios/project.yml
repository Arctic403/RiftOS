name: RiftOSNative
options:
  bundleIdPrefix: com.riftos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  RiftOSNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RiftOSNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riftos.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
